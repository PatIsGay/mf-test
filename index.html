    ${e.tags.filter(pzHas).map(t=>`<details><summary>${esc(t)} · ${(PRINZIP[t]||[]).length} Prinzip-Cues</summary>${(PRINZIP[t]||[]).map(c=>`<div class="cue p">${esc(c)}</div>`).join('')}</details>`).join('')}</div>
    <div class="exsec"><div class="row"><span class="lbl">Status</span><div class="chips">${['aktiv','testphase','geparkt','verworfen'].map(x=>`<button class="chip sm ${st===x?'on':''}" data-st="${e.id}:${x}">${x}</button>`).join('')}</div></div>
    ${ip?`<button class="btn ghost wide" data-rmplan="${e.id}">Aus dem Plan nehmen</button>`:st!=='verworfen'?`<div class="row" style="flex-wrap:nowrap"><button class="btn ghost" style="flex:1" data-toplan="${e.id}">In den Plan</button>${qBtn('toplan')}</div>${qHint('toplan','Testphase: die Übung bleibt gekennzeichnet, bis du sie auf aktiv setzt. Sie darf im Plan stehen.')}`:''}
    <div class="row" style="justify-content:flex-end"><button class="tog" data-exedit="${e.id}" style="font-size:13px">Bearbeiten</button></div></div>
    </div></div>`}).join('')}</div></section>
  <button class="btn ghost wide" id="newExBib">+ Neue Übung</button>`;
  document.querySelectorAll('[data-bibopen]').forEach(b=>b.onclick=()=>openBibSheet(b.dataset.bibopen));
  const ir=document.getElementById('inboxRow'); if(ir)ir.onclick=inboxSheet;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.bibFilter=b.dataset.f;render()});
  const qi=document.getElementById('q'); if(qi)qi.oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('#exl .ex').forEach(it=>it.style.display=it.textContent.toLowerCase().includes(v)?'':'none')};
  document.getElementById('newExBib').onclick=()=>newExerciseSheet(id=>{S.openEx=id;S.bibFilter='alle';render();const c=document.querySelector('#exl .ex.open');if(c)c.scrollIntoView({block:'nearest'})});
  document.querySelectorAll('[data-exedit]').forEach(b=>b.onclick=()=>exEditSheet(exById(b.dataset.exedit)));
  document.querySelectorAll('[data-exziel]').forEach(b=>b.onclick=()=>exTestsSheet(exById(b.dataset.exziel),()=>{closeSheet();render()}));
  // Kachel antippen klappt die Tage auf, erneut antippen wieder zu; nur eine Liste je Übung
  document.querySelectorAll('[data-bil]').forEach(b=>b.onclick=()=>{const [id,m]=b.dataset.bil.split(':');BILMODE[id]=BILMODE[id]===m?null:m;render()});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.openEx=S.openEx===b.dataset.open?null:b.dataset.open;render()});
  document.querySelectorAll('[data-rtday]').forEach(b=>b.onclick=()=>daySheet(b.dataset.rtday));
  document.querySelectorAll('[data-exday]').forEach(b=>b.onclick=()=>daySheet(b.dataset.exday));
  // Notizen zur Übung: „+“ öffnet das Feld auf der Karte (bibNoteDone); Ändern und Löschen über noteEditSheet (auch im Training)
  document.querySelectorAll('[data-nadd^="bib:"]').forEach(b=>b.onclick=()=>{const id=b.dataset.nadd.slice(4);if(!(BIB_NOTE&&BIB_NOTE.id===id))BIB_NOTE={id,n:null};render();noteFocus('bib:'+id)});
  document.querySelectorAll('[data-ninput^="bib:"]').forEach(inp=>{const id=inp.dataset.ninput.slice(4);
    inp.oninput=()=>{const B=BIB_NOTE;if(!B||B.id!==id)return;const v=inp.value;S.exNotes=S.exNotes||{};const ns=S.exNotes[id]=S.exNotes[id]||[];
      if(v.trim()){if(!B.n){B.n={d:iso(today),t:v};ns.push(B.n)}else B.n.t=v}
      else if(B.n){const k=ns.indexOf(B.n);if(k>=0)ns.splice(k,1);if(!ns.length)delete S.exNotes[id];B.n=null}
      save()};
    inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();bibNoteDone()}}});
  document.querySelectorAll('[data-nok^="bib:"]').forEach(b=>{b.onmousedown=ev=>ev.preventDefault();b.onclick=()=>bibNoteDone()});
  document.querySelectorAll('[data-nedit]').forEach(b=>b.onclick=()=>noteEditSheet(b.dataset.nedit));
  // eigene Cues auf der Karte bearbeiten, löschen und neu anlegen (wie im Training)
  document.querySelectorAll('[data-bec]').forEach(b=>b.onclick=()=>{const [id,ci]=b.dataset.bec.split(':');const e=exById(id);cueEditSheet(e.cues[+ci],v=>{const arr=[...e.cues];if(v==null)arr.splice(+ci,1);else arr[+ci]=v;setCues(e,arr);render()})});
  document.querySelectorAll('[data-nadd^="cue:bib:"]').forEach(b=>b.onclick=()=>cueAddOpen(b.dataset.nadd,b.dataset.nadd.slice(8)));
  // Cues ziehen: neue Reihenfolge gilt überall (Karte und Training), gespeichert wie bearbeitete Cues
  document.querySelectorAll('[data-sortcues]').forEach(l=>sortable(l,(from,to)=>{const e=exById(l.dataset.sortcues);if(!e)return;setCues(e,moveItem(e.cues,from,to));render();toast('Reihenfolge geändert')}));
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const [id,st]=b.dataset.st.split(':');S.exStatus[id]=st;addEvent(`${exById(id).name}: Status ${st}`);toast('Status geändert');render()});
  document.querySelectorAll('[data-toplan]').forEach(b=>b.onclick=()=>{const id=b.dataset.toplan;pickBlock(bid=>{addToPlan(id,bid,render);render()},'In welchen Block?')});
  document.querySelectorAll('[data-rmplan]').forEach(b=>b.onclick=()=>{const id=b.dataset.rmplan;p.blocks.forEach(bl=>bl.items=bl.items.filter(x=>x[0]!==id));newVersion('− '+exById(id).name);toast('Aus dem Plan, neue Version');render()});
}
// Plan, Tests und Verlauf als Vollbild-Sheet; keep=true behält die Scrollposition beim Neuzeichnen
function openBibSheet(kind,keep){
  const p=P(); const cur=p.versions[p.versions.length-1];
  const re=()=>{render();openBibSheet(kind,true)};
  const T={plan:'Plan',tests:'Tests',verlauf:'Verlauf'}[kind];
  let html='';
  if(kind==='plan'){
    const block=b=>`<section class="card"><div class="row between" style="margin-bottom:8px"><button class="blockhead" data-bedit="${b.id}">${esc(b.name)}<span class="pen">ändern</span></button><span class="act ${b.type}">${TYPES[b.type].l}</span></div><div class="list" data-sortblock="${b.id}">${b.items.map(([id,,sd])=>{const e=exById(id);return `<div class="item sortrow">${b.items.length>1?DRAGH:''}<div class="t"><b>${esc(e.name)}${exStatus(e)==='testphase'?' <span class="badge test">Testphase</span>':''}</b><small><button class="dchip" data-pdose="${b.id}:${id}">${doseStr(e.d)}</button>${sideLbl(sd)||(e.side==='getrennt'?' · L/R':'')}</small><button class="goalline${exTests(id).length?'':' none'}" data-extests="${id}">${exTestsLine(e,sd)}</button></div><button class="chip sm" data-swap="${b.id}:${id}">tauschen</button><button class="chip sm" data-rm="${b.id}:${id}">−</button></div>`}).join('')||'<div class="hint">leer</div>'}</div><button class="btn ghost wide" style="margin-top:8px" data-add="${b.id}">+ Übung in Block</button></section>`;
    html=`<section class="card"><div class="row between"><div><h2 style="margin:0">Plan v${cur.v} · seit ${dfmt(cur.from)} · ${daysBetween(cur.from,iso(today))} Tage</h2><small class="hint">${(s=>s.sess?`${s.full} von ${s.sess} Einheit${s.sess===1?'':'en'} vollständig`:'noch keine Einheit')(stats([...Array(Math.max(daysBetween(cur.from,iso(today)),1)).keys()].map(i=>addD(new Date(cur.from+'T12:00:00'),i))))}</small></div><button class="chip sm" id="toVerlauf">Verlauf ›</button></div><div class="lbl" style="margin-top:8px">Ziele</div><div class="list">${P().ziele.map(z=>`<button class="item goal" data-goal="${z.id}"><span class="t">${goalHtml(z)}</span><span class="go">›</span></button>`).join('')||'<div class="hint">Noch kein Ziel.</div>'}</div><button class="btn ghost wide" style="margin-top:6px" id="goalAdd">+ Ziel</button></section>
    <section class="card" id="rasterCard"><div class="row between" style="margin-bottom:10px;flex-wrap:nowrap"><h2 style="margin:0">Wochenraster</h2>${qBtn('raster')}</div><div class="raster">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="d ${wd(today)===w?'today':''}" data-w="${w}">${w}${(p.raster[w]||[]).map(t=>{const bb=blockById(t);return bb?`<span class="bsw ${bb.type}" title="${esc(bb.name)}">${esc(shortN(bb.name))}</span>`:`<span class="sw ${t}" title="${TYPES[t]?TYPES[t].l:t}"></span>`}).join('')||'<span class="sw" style="background:transparent"></span>'}</div>`).join('')}</div>
    <div class="legend" style="margin-top:8px"><span><i style="background:var(--k)"></i>Korrektiv</span><span><i style="background:var(--i)"></i>Intensiv</span><span><i style="background:var(--tennis)"></i>Tennis</span><span><i style="background:var(--laufen)"></i>Laufen</span><span><i style="background:var(--pause)"></i>Pause</span></div>
    ${qHint('raster','Tipp auf einen Tag ändert das Raster ab heute. Erscheint im Verlauf, erzeugt aber keine neue Version. Einzelne Tage planst du im Kalender über die Zeile Geplant.','margin-top:6px')}</section>
    ${p.blocks.map(block).join('')||'<section class="card"><div class="hint">Noch kein Block angelegt.</div></section>'}
    <div class="row" style="flex-wrap:nowrap"><button class="btn ghost" style="flex:1" id="newBlock">+ Block</button>${qBtn('versionen')}</div>
    ${qHint('versionen','Übung rein, raus oder tauschen erzeugt automatisch eine neue Plan-Version. Testphase-Übungen, die du im Training ad hoc mitmachst, ändern den Plan nicht.')}`;
  } else if(kind==='verlauf'){
    const rows=[...p.versions.map(v=>({k:'v',d:v.from,v})),...p.events.map(e=>({k:'e',d:e.d,e}))].sort((a,b)=>b.d.localeCompare(a.d)||(a.k==='v'?-1:1));
    html=`<div class="hint">Neueste oben. Eine Version = feste Übungsliste. Dazwischen Raster- und Statusänderungen.</div><section class="card"><div class="list">${rows.map(r=>{
      if(r.k==='e')return `<div class="item ev"><span class="prio">${dfmt(r.d)}</span><div class="t"><small style="color:var(--ink2)">${esc(r.e.t)}</small></div></div>`;
      const v=r.v; const end=v.to||iso(today); const n=daysBetween(v.from,end); const ds=[...Array(Math.max(n,1)).keys()].map(i=>addD(new Date(v.from+'T12:00:00'),i)); const s=stats(ds); const open=S.openV===v.v;
      return `<div class="item vrow ${open?'open':''}" data-v="${v.v}"><div class="t"><b>v${v.v} · ${v.to?dfmt(v.from)+' – '+dfmt(v.to):'seit '+dfmt(v.from)} · ${n} Tag${n===1?'':'e'}</b><small>${esc(v.change)}</small>
        <div class="row" style="gap:6px;margin-top:6px"><span class="act K">K ×${s.cnt('K')}</span><span class="act I">I ×${s.cnt('I')}</span><span class="act Tennis">T ×${s.cnt('Tennis')}</span><span class="kpi"><span class="hint">Form</span><span class="sy ${cls(Math.round(s.tf))}">${fmtN(s.tf)}</span></span><span class="kpi"><span class="hint">Sympt.</span><span class="sy ${clsSy(Math.round(s.sc))}">${fmtN(s.sc)}</span></span><span class="kpi"><span class="hint">vollst.</span><span>${s.full}/${s.sess}</span></span></div>
        ${open?`<div class="vdet">${(v.blocks||[]).map(vb=>`<div class="vblock"><h2>${esc(vb.name)} <span class="act ${vb.type}">${TYPES[vb.type].l}</span></h2><div class="list">${vb.items.map(([id,pr,sd])=>{const e=exById(id);return `<div class="item"><span class="act ${e.cat}">${e.cat}</span><div class="t"><b>${esc(e.name)}${exStatus(e)==='testphase'?' <span class="badge test">Testphase</span>':''}</b><small>${doseStr(e.d)}${sideLbl(sd)||(e.side==='getrennt'?' · L/R':'')}</small></div></div>`}).join('')||'<div class="hint">leer</div>'}</div></div>`).join('')||'<div class="hint">Keine Blöcke.</div>'}</div>`:''}
        </div><span>${open?'▾':'▸'}</span></div>`}).join('')}</div></section>`;
  } else {
    const groups=['Table','Bewegung','Eigene'];
    // Datumsspalten: zwei Beispielspalten (TESTVALS), Tage mit Messungen (außer heute), rechts „heute“; höchstens 6, die neuesten
    const tk=iso(today);
    const exIso=l=>{const [dd,mm]=l.split('.');const y=today.getFullYear();const k=`${y}-${mm}-${dd}`;return k>tk?`${y-1}-${mm}-${dd}`:k};
    const dayVal=(k,n)=>{const ts=(S.days[k].tests||[]).filter(x=>x.n===n);return ts.length?ts[ts.length-1]:null};
    const cm=new Map();
    if(TEST)['20.08.','03.09.'].forEach(l=>cm.set(exIso(l),{lbl:l,val:n=>{const x=(TESTVALS[n]||[]).find(v=>v[0]===l);return x?{l:x[1],r:x[2]}:null},miss:'–'}));
    Object.keys(S.days).filter(k=>k<tk&&(S.days[k].tests||[]).length).forEach(k=>cm.set(k,{lbl:dfmt(k),val:n=>dayVal(k,n),miss:'–'}));
    const cols=[...[...cm.entries()].sort((a,b)=>a[0].localeCompare(b[0])).slice(-5).map(([k,c])=>Object.assign({k},c)),{k:tk,lbl:'heute',val:n=>dayVal(tk,n),miss:'·'}];
    // Plan-Version, die an diesem Datum galt; „heute“ = aktuelle Version
    const pvAt=c=>{const v=c.k===tk?cur:p.versions.find(v=>v.from<=c.k&&(v.to==null||c.k<v.to));return v?`<small class="pv">v${v.v}</small>`:''};
    // Retests je Test: je Übung das letzte vollständige Paar, Übungen nach Datum absteigend, höchstens 4
    const rtLast={};Object.keys(S.days).sort().forEach(k=>(S.days[k].done||[]).forEach(a=>(a.ex||[]).forEach(i=>{if(i.rt&&i.rt.nach)(rtLast[i.rt.test]=rtLast[i.rt.test]||{})[i.id]={k,rt:i.rt}})));
    const rtDiff=rt=>rtSides(rt).map(([s,a,b])=>`<span style="white-space:nowrap">${s?s+' ':''}${rtDelta(rt.test,a,b,true)||esc(a)+'→'+esc(b)}</span>`).join(' · ');
    const rtLine=t=>{const es=Object.entries(rtLast[t.n]||{}).filter(([id])=>exById(id)).sort((a,b)=>b[1].k.localeCompare(a[1].k)).slice(0,4);if(!es.length)return '';
      return `<div class="rtest"><b>${esc(testShort(t.n))}</b> · ${es.map(([id,o])=>`<span class="rte"><button class="rtex" data-rtex="${id}">${esc(exById(id).name)}</button> ${rtDiff(o.rt)} <span style="white-space:nowrap">(${dfmt(o.k)})</span></span>`).join(' · ')}</div>`};
    const rtBlock=g=>{const rows=TESTS.filter(t=>t.g===g).map(rtLine).join('');return rows?`<div class="rtblock"><span class="ftl">Retests</span>${rows}</div>`:''};
    const keinTest=cols.length===1&&!TESTS.some(t=>cols[0].val(t.n));
    html=`${keinTest?'<div class="hint" id="testsEmpty">Noch keine Messung. „Assessment starten“ misst die neun Tests der Vorlage nacheinander, „Einzeltest“ einen einzelnen.</div>':''}<div class="row between"><div class="hint">Tabelle wie in der Trainer-Vorlage. Spalten = Messdaten, L / R.</div><div class="row" style="gap:8px"><button class="btn primary" id="assess">Assessment starten</button><button class="btn ghost" id="einzel">Einzeltest</button></div></div>
    ${groups.map(g=>`<section class="card"><h2>${g==='Table'?'Table Tests (Grad)':g==='Bewegung'?'Bewegungstests (cm)':'Eigene Tests'}</h2><div class="matrix-wrap"><table class="matrix tests"><thead><tr><th>Test</th>${cols.map(c=>`<th colspan="2">${c.lbl}${pvAt(c)}</th>`).join('')}</tr></thead><tbody>${TESTS.filter(t=>t.g===g).map(t=>`<tr><td>${t.n}<br><span class="hint">${t.u}</span></td>${cols.map(c=>{const v=c.val(t.n);return v?`<td>${esc(v.l)}</td><td>${esc(v.r)}</td>`:`<td>${c.miss}</td><td>${c.miss}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>${rtBlock(g)}</section>`).join('')}`;
  }
  const y=keep?(BIBY[kind]||0):0;
  openSheet(`<div class="daynav bshead"><h3>${T}</h3><button class="xbtn" id="bsX" aria-label="Schließen">✕</button></div>${html}`,true);
  sheet.dataset.bibk=kind; delete sheet.dataset.back; sheet.scrollTop=y; BIBY[kind]=sheet.scrollTop;
  const sub=f=>{f();sheet.dataset.back=kind}; // Untersheet öffnen und Rückweg merken
  document.getElementById('bsX').onclick=closeSheet;
  if(kind==='plan'){
    document.getElementById('toVerlauf').onclick=()=>openBibSheet('verlauf');
    document.querySelectorAll('#sheet [data-bedit]').forEach(b=>b.onclick=()=>sub(()=>blockSheet(b.dataset.bedit,re)));
    document.getElementById('newBlock').onclick=()=>sub(()=>newBlockSheet(re));
    // Ziele ändern und neu anlegen, Absicht der Übung (soll verbessern) bearbeiten; Abbruch führt ins Plan-Sheet zurück
    document.querySelectorAll('#sheet [data-goal]').forEach(b=>b.onclick=()=>sub(()=>goalSheet(P().ziele.find(z=>z.id===b.dataset.goal),re)));
    document.getElementById('goalAdd').onclick=()=>sub(()=>goalSheet(null,re));
    document.querySelectorAll('#sheet [data-extests]').forEach(b=>b.onclick=()=>sub(()=>exTestsSheet(exById(b.dataset.extests),re)));
    document.querySelectorAll('#sheet [data-pdose]').forEach(b=>b.onclick=()=>{const id=b.dataset.pdose.split(':')[1];sub(()=>doseSheet(exById(id),re))});
    document.querySelectorAll('#sheet [data-rm]').forEach(b=>b.onclick=()=>{const [bid,id]=b.dataset.rm.split(':');const bl=blockById(bid);bl.items=bl.items.filter(x=>x[0]!==id);newVersion('− '+exById(id).name+' ('+bl.name+')');toast('Neue Version v'+P().versions[P().versions.length-1].v);re()});
    document.querySelectorAll('#sheet [data-swap]').forEach(b=>b.onclick=()=>{const [bid,id]=b.dataset.swap.split(':');sub(()=>pickExercise(nid=>{const bl=blockById(bid);bl.items=bl.items.map(x=>x[0]===id?[nid,x[1]]:x);newVersion(exById(id).name+' → '+exById(nid).name+' ('+bl.name+')');toast('Neue Version');re()}))});
    document.querySelectorAll('#sheet [data-add]').forEach(b=>b.onclick=()=>sub(()=>pickExercise(nid=>addToPlan(nid,b.dataset.add,re),{title:'Übung in den Plan'})));
    // Übungen im Block ziehen: wie die Reihenfolge der Blöcke keine neue Plan-Version, nur ein Eintrag im Verlauf (einmal je Block und Tag)
    document.querySelectorAll('#sheet [data-sortblock]').forEach(l=>sortable(l,(from,to)=>{const bl=blockById(l.dataset.sortblock);if(!bl)return;
      bl.items=moveItem(bl.items,from,to);
      const t='Block „'+bl.name+'“: Reihenfolge der Übungen geändert', ev=P().events, last=ev[ev.length-1];
      if(!(last&&last.d===iso(today)&&last.t===t))addEvent(t);
      BIBY.plan=sheet.scrollTop; save(); re(); toast('Reihenfolge geändert')}));
    document.querySelectorAll('#sheet [data-w]').forEach(b=>b.onclick=()=>{const w=b.dataset.w;const sel=p.raster[w]||[];
      sub(()=>openSheet(`<h3>${w}: Was ist dran?</h3><div id="rc"><div class="chips">${p.blocks.map(bb=>`<button class="chip bch ${sel.includes(bb.id)?'on':''}" data-t="${bb.id}"><i class="sw ${bb.type}"></i>${esc(bb.name)}</button>`).join('')||'<span class="hint">Noch kein Block angelegt.</span>'}</div><div class="chips" style="margin-top:8px">${['Tennis','Laufen','Pause'].map(t=>`<button class="chip ${sel.includes(t)?'on':''}" data-t="${t}">${TYPES[t].l}</button>`).join('')}</div></div><div class="hint">Blöcke oben, Aktivitäten unten. Gilt ab heute für alle kommenden ${w}. Änderung wird datiert.</div><button class="btn primary wide" id="rs">Übernehmen</button>`));
      document.querySelectorAll('#rc .chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));
      document.getElementById('rs').onclick=()=>{p.raster[w]=[...document.querySelectorAll('#rc .chip.on')].map(c=>c.dataset.t);addEvent(`Wochenraster ${w}: ${p.raster[w].map(labelOf).join(' + ')||'leer'}`);
        // künftige Tage übernehmen das neue Raster, einzeln geplante Tage (plannedManual) behalten ihren Wert
        Object.keys(S.days).forEach(k=>{const dd=S.days[k];if(k>iso(today)&&wd(new Date(k+'T12:00:00'))===w&&!dd.plannedManual)dd.planned=[...p.raster[w]]});
        re();toast('Raster ab heute geändert')}});
  } else if(kind==='verlauf'){
    document.querySelectorAll('#sheet .vrow').forEach(r=>r.onclick=()=>{S.openV=S.openV===+r.dataset.v?null:+r.dataset.v;re()});
  } else {
    document.getElementById('assess').onclick=()=>sub(()=>testSheet(TESTS.filter(t=>t.g!=='Eigene')));
    // Einzeltest: Auswahl aller Tests, Abbruch führt ins Tests-Sheet zurück
    document.getElementById('einzel').onclick=()=>sub(()=>{openSheet(`<h3>Welcher Test?</h3><div class="list">${TESTS.map((t,i)=>`<button class="item" style="width:100%;text-align:left" data-t1="${i}"><div class="t"><b>${t.n}</b><small>${t.u}</small></div><span class="badge">${t.g}</span></button>`).join('')}</div>`);
      document.querySelectorAll('#sheet [data-t1]').forEach(b=>b.onclick=()=>testSheet([TESTS[+b.dataset.t1]]))});
    // Retests: Übungsname öffnet die Bibliothekskarte; ist sie durch den Filter ausgeblendet, gilt „Alle“
    document.querySelectorAll('#sheet [data-rtex]').forEach(b=>b.onclick=()=>{closeSheet();S.openEx=b.dataset.rtex;setTab('bib');
      if(!document.querySelector('#exl .ex.open')){S.bibFilter='alle';render()}
      const c=document.querySelector('#exl .ex.open'),top=document.querySelector('.top');if(c)window.scrollBy(0,c.getBoundingClientRect().top-(top?top.getBoundingClientRect().bottom:0)-8)});
  }
}
// Notizen ohne Bezug: normales Sheet, nach dem Zuordnen zurück zur Liste, solange noch welche offen sind
function inboxSheet(){
  openSheet(`<h3>Notizen ohne Bezug</h3><div class="list">${S.inbox.map((n,i)=>`<div class="item"><div class="t"><b>${esc(n.t)}</b><small>${n.d}</small></div><button class="chip sm" data-assign="${i}">zuordnen</button></div>`).join('')||'<div class="hint">Leer.</div>'}</div>`);

function bilanz(e){let n=0,p=0;Object.values(S.days).forEach(d=>d.done.forEach(a=>(a.ex||[]).forEach(i=>{if(i.id===e.id&&i.r){n++;if(i.pain)p++}})));

// ---------- Kalender ----------

const SYMCOL=['#2E8B4E','#3D6FD0','#D2691E','#A0479B','#8C8C1A'];
function symChart(days){
  const W=360,H=150,L=26,R=26,T=10,B=22; const n=days.length;
  const x=i=>L+(W-L-R)*(n===1?0:i/(n-1)); const y=v=>T+(H-T-B)*(1-v/10);
  const series=[{name:'Score',col:'var(--ink)',w:2.4,vals:days.map(d=>{const o=dayOf(d);return o.future?null:symScore(o.sy)})}];
  if(S.symOpen){const syms=symsIn(days);syms.forEach((s,i)=>series.push({name:symLabel(s,syms),col:SYMCOL[i%SYMCOL.length],w:1.2,dash:i>=SYMCOL.length,vals:days.map(d=>{const o=dayOf(d);return o.future?null:syVal(o,s.id)})}))}
  const path=vals=>{let d='',pen=false;vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true});return d};
  const grid=[0,5,10].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${v}</text>`).join('');
  const weeks=days.map((d,i)=>d.getDay()===1?`<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-width="1.5"/><text x="${x(i)+3}" y="${H-6}" font-size="10" fill="var(--ink3)">${fmt(d)}</text>`:'').join('');
  const lines=series.map(sr=>`<path d="${path(sr.vals)}" fill="none" stroke="${sr.col}" stroke-width="${sr.w}"${sr.dash?' stroke-dasharray="4 3"':''} stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const dots=series[0].vals.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${series[0].col}" stroke="var(--surface)" stroke-width="1.5"><title>${fmt(days[i])}: Score ${fmtN(v)}</title></circle>`).join('');
  const legend=series.length>1?`<div class="legend" style="margin-top:6px">${series.map(sr=>`<span><i style="background:${sr.dash?`repeating-linear-gradient(90deg,${sr.col} 0 4px,transparent 4px 7px)`:sr.col};height:3px;border-radius:2px;width:16px"></i>${esc(sr.name)}</span>`).join('')}</div>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:100%" role="img" aria-label="Symptom-Score über ${n} Tage">${grid}${weeks}${lines}${dots}</svg>${legend}`;
}
function symScore(sy){const src=sy||{};const v=symList().map(s=>src[s.id]).filter(x=>x!=null);if(!v.length)return null;const m=Math.max(...v);const idx=v.indexOf(m);const others=v.filter((x,i)=>i!==idx);const o=others.length?others.reduce((a,b)=>a+b,0)/others.length:0;return Math.min(10,Math.round((m+o/2)*10)/10)}
const fmtN=n=>n==null?'–':(Math.round(n*10)/10).toLocaleString('de-DE');
// künftige Tage: Wert aus dem Raster, außer der Tag wurde einzeln geplant (plannedManual)
function stripKochen(pl){return (pl||[]).filter(t=>t!=='Kochen')}
function dayOf(d){const k=iso(d);const x=S.days[k];if(x){if(k<=iso(today))return x;return Object.assign({},x,{planned:x.plannedManual?x.planned:stripKochen(P().raster[wd(d)]),future:true})}return {tf:null,tfA:null,sleep:null,sq:null,sy:{},syA:{},extra:[],chips:[],note:'',planned:stripKochen(P().raster[wd(d)]),done:[],abw:[],notes:[],tests:[],future:true}}
function stats(days){
  const w=days.map(d=>dayOf(d)).filter(x=>!x.future);
  const vals=a=>a.filter(x=>x!=null); const avg=a=>{const v=vals(a);return v.length?v.reduce((p,c)=>p+c,0)/v.length:null};
  const cnt=t=>w.reduce((n,x)=>n+x.done.filter(a=>a.type===t).length,0);
  const trainDays=w.map(x=>x.done.some(a=>['K','I'].includes(a.type)));
  const iDays=w.map((x,i)=>x.done.some(a=>a.type==='I')?i:-1).filter(i=>i>=0);
  const gaps=iDays.slice(1).map((v,i)=>v-iDays[i]);
  let streak=0,best=0;trainDays.forEach(t=>{streak=t?streak+1:0;best=Math.max(best,streak)});
  const perSym=symsIn(days).map(s=>{const v=vals(w.map(x=>syVal(x,s.id)));return {s:symName(s),avg:avg(v),max:v.length?Math.max(...v):null,bad:v.filter(x=>x>=5).length}}).sort((a,b)=>(b.avg??-1)-(a.avg??-1));
  const fills=days.filter(d=>iso(d)<=iso(today)).flatMap(d=>{const k=iso(d);return dayOf(d).done.map(a=>{const f=sessFill(a,k);return f&&Object.assign({t:a.type},f)}).filter(Boolean)});
  return {n:w.length,tf:avg(w.map(x=>x.tf)),sc:avg(w.map(x=>symScore(x.sy))),sleep:avg(w.map(x=>x.sleep)),badSleep:w.filter(x=>x.sq==='schlecht').length,cnt,gaps,best,pause:trainDays.filter(t=>!t).length,perSym,stress:w.filter(x=>x.chips.includes('Stress')).length,sit:w.filter(x=>x.chips.includes('Viel gesessen')).length,sess:fills.length,full:fills.filter(f=>f.full).length,part:t=>fills.some(f=>f.t===t&&!f.full)};
}
function rKal(){

  const sw=(arr,plan,k)=>{const a=grp(arr,plan,k);return `<span class="cell">${a.length?a.map(o=>{const tt=[o.n>1?o.n+'×':'',o.part.length?'unvollständig, '+o.part.join(' · '):'',o.xtra.length?'außerplanmäßig: '+o.xtra.join(', '):''].filter(Boolean).join(', ');return `<span class="sw ${o.t}${o.part.length?' part':''}${o.xtra.length?' xtra':''}"${tt?` title="${tt}"`:''}>${o.n>1&&!M?o.n:''}</span>`}).join(''):'<span class="hint">·</span>'}</span>`};
  const syCell=v=>v==null||v===0?'<span class="hint">·</span>':`<span class="sy ${clsSy(Math.round(v))}">${fmtN(v)}</span>`;
  const syms=symsIn(days);
  const sides=[...new Set(syms.map(s=>s.side).filter(Boolean))];
  const symHint=syms.length&&sides.length===1&&syms.every(s=>s.side)?` Symptome alle ${sides[0]==='r'?'rechts':'links'}.`:'';
  const dot=on=>on?'<span class="dot"></span>':'';
  const R=S.kalRows;

  const rowsDef=[
    ['plan','Geplant',x=>sw(x.planned,true),'plan'],

    // eingeklappt: Kurve statt Zahlen (fünfter Eintrag = eine Zelle über alle Tage, gezeichnet von drawSparks)
    ['sym',`<button class="tog" data-tog="sym">Symptome ${S.symOpen?'▾':'▸'}</button>`,x=>x.future?'':syCell(symScore(x.sy)),undefined,!S.symOpen],
    ...(S.symOpen?syms.map(s=>['sym',`<span class="sub">${esc(symLabel(s,syms))}</span>`,x=>{const v=syVal(x,s.id);return x.future||v==null||v===0?'<span class="hint">·</span>':`<span class="sy ${clsSy(v)}">${v}</span>`}]):[]),
    ['sleep','Schlaf',x=>x.sleep==null?'':M?`<span class="sy ${x.sleep>=7?'c0':x.sleep>=6?'c2':'c3'}">${x.sleep.toLocaleString('de-DE')}</span>`:`${x.sleep.toLocaleString('de-DE')}<span class="hint">${(x.sq||'').slice(0,1)}</span>`],

  const body=rowsDef.map(([k0,l,f,pl,sp],i)=>`<tr class="${i&&GRP[k0]!==GRP[rowsDef[i-1][0]]?'sep':''}"><td>${l}</td>${sp?`<td class="day spark" colspan="${days.length}"><svg class="spark"></svg></td>`:days.map(d=>`<td class="day ${wb(d)} ${fut(d)} ${iso(d)===iso(today)?'today':''}" data-d="${iso(d)}"${pl&&iso(d)>=iso(today)?' data-plan="1"':''}>${f(dayOf(d),iso(d))}</td>`).join('')}</tr>`).join('');

// Symptom-Score als Kurve in der eingeklappten Symptomzeile: misst die Zellbreite und zeichnet in Pixeln, Punkte mittig unter den Tagesköpfen
function drawSparks(days){
  const td=document.querySelector('td.spark'); if(!td)return;
  const svg=td.querySelector('svg.spark'); const n=days.length; const M=n>7;
  // im Querformat (kalFit) wächst die Kurve mit der Zeilenhöhe
  const kr=parseFloat(getComputedStyle(td.closest('table')).getPropertyValue('--kalrh'))||0;
  const W=td.clientWidth, H=kr?Math.max(18,Math.floor(kr-2)):(M?28:36), pad=M?4:6, cw=W/n;
  const lbl=!M; // Beschriftung nur in der Woche
  // Spaltengrenzen aus den Tagesköpfen (im Monat sind die Spalten ungleich breit); Ersatz: gleich breite Spalten W/n
  const tr0=td.getBoundingClientRect(), x0=tr0.left+td.clientLeft;
  const ths=[...td.closest('table').tHead.rows[0].cells].slice(1);
  const cols=ths.length===n?ths.map(th=>{const r=th.getBoundingClientRect();return {l:r.left-x0,c:(r.left+th.clientLeft+r.right)/2-x0,r:r.right-x0}}):days.map((d,i)=>({l:i*cw,c:(i+0.5)*cw,r:(i+1)*cw}));
  const x=i=>cols[i].c, y=v=>pad+(H-2*pad)*(1-v/10);
  const vals=days.map(d=>{const o=dayOf(d);return o.future?null:symScore(o.sy)});
  // zweite Serie „später am Tag“ (syA, heute nur über die Karte „Später am Tag“): dünn, grau, gestrichelt, unter der Morgenkurve
  const valsA=days.map(d=>{const o=dayOf(d);return o.future?null:symScore(o.syA)});
  const COL={c0:'var(--g0)',c2:'var(--g2)',c3:'var(--g3)',c4:'var(--g4)'};
  const f1=v=>v.toFixed(1);
  const rect=(i,fill)=>`<rect x="${f1(cols[i].l)}" y="0" width="${f1(cols[i].r-cols[i].l)}" height="${H}" fill="${fill}"/>`;
  const bg=days.map((d,i)=>iso(d)===iso(today)?rect(i,'var(--accent-soft)'):iso(d)>iso(today)?rect(i,'var(--surface2)'):'').join('');
  // Montage im Monat: Linie am Spaltenanfang wie die wb-Linien der übrigen Zeilen
  const wbl=M?days.map((d,i)=>{const lx=f1(Math.max(cols[i].l+1,0.75));return d.getDay()===1?`<line class="wbl" x1="${lx}" x2="${lx}" y1="0" y2="${H}" stroke="var(--ink3)" stroke-width="1.5"/>`:''}).join(''):'';
  let path='',pen=false; vals.forEach((v,i)=>{if(v==null){pen=false;return}path+=(pen?'L':'M')+f1(x(i))+' '+f1(y(v))+' ';pen=true});
  // „später“ ist spärlich (nur an Trainingstagen); die gestrichelte Linie verbindet deshalb über Lücken hinweg
  let pathA='',penA=false; valsA.forEach((v,i)=>{if(v==null)return;pathA+=(penA?'L':'M')+f1(x(i))+' '+f1(y(v))+' ';penA=true});
  const lineA=pathA?`<path class="spA" d="${pathA.trim()}" fill="none" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="3 3" stroke-linejoin="round"/>`:'';
  const dotsA=valsA.map((v,i)=>v==null?'':`<circle class="spA" cx="${f1(x(i))}" cy="${f1(y(v))}" r="${M?1.5:2}" fill="var(--ink3)"><title>${fmt(days[i])}: später: Score ${fmtN(v)}</title></circle>`).join('');
  const line=path?`<path d="${path.trim()}" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  const dots=vals.map((v,i)=>v==null?'':`<circle cx="${f1(x(i))}" cy="${f1(y(v))}" r="${M?2.2:3.2}" fill="${COL[clsSy(Math.round(v))]||'var(--ink3)'}" stroke="var(--surface)" stroke-width="1"><title>${fmt(days[i])}: Score ${fmtN(v)}</title></circle>`).join('');
  const txt=lbl?vals.map((v,i)=>v==null?'':`<text x="${f1(x(i))}" y="${f1(y(v)<10?y(v)+11:y(v)-6)}" text-anchor="middle" font-size="9.5" style="font-family:&quot;IBM Plex Mono&quot;,monospace" fill="var(--ink2)">${fmtN(v)}</text>`).join(''):'';
  svg.setAttribute('viewBox',`0 0 ${f1(W)} ${H}`); svg.setAttribute('height',H);
  svg.setAttribute('role','img'); svg.setAttribute('aria-label',`Symptom-Score über ${n} Tage`);

}

const testOf=n=>TESTS.find(t=>t.n===n);
// einseitig gemessen: Kennzeichen im Test-Katalog (TESTS single)
const testSingle=n=>!!(testOf(n)||{}).single;
// Testname kurz: Klammerkürzel („Gestrecktes Beinheben (SLR)“ → „SLR“), sonst der Name
const testShort=n=>{const m=String(n).match(/\(([^)]+)\)\s*$/);return m?m[1]:n};
const goalName=z=>testShort(z.test)+(z.side==='l'?' links':z.side==='r'?' rechts':z.side==='a'?' · Seite der Ausführung':z.side==='g'?' · Gegenseite':z.side==='b'?' · beide Seiten':'');
// Zahl in der Einheit des Tests; Texte wie „2 cm“ oder „ja“ unverändert
function goalVal(n,v){if(v==null||v==='')return '–';if(typeof v!=='number')return String(v);const u=(testOf(n)||{}).u||'';const s=v.toLocaleString('de-DE');return u==='cm'?s+' cm':u==='s'?s+' s':/°/.test(u)?s+'°':s}
function goalLast(z){const v=lastTestVal(z.test,z.side||'l');return v==null?'noch kein Wert':'zuletzt '+goalVal(z.test,v)}
function goalStr(z){return `${goalName(z)} · Ziel ${goalVal(z.test,z.target)} · ${goalLast(z)}`}
// Abschnitte bleiben beim Umbruch zusammen („zuletzt 5 cm“ nicht zerrissen)
const nw=t=>`<span style="white-space:nowrap">${esc(t)}</span>`;
const goalHtml=z=>`<b>${esc(goalName(z))}</b> · ${nw('Ziel '+goalVal(z.test,z.target))} · ${nw(goalLast(z))}`;
// Absicht der Übung (S.exTests[exId] = [{test, side}], der erste ist primär); Ziel nur, wenn Test und (ermittelte) Seite übereinstimmen
const exTests=exId=>(S.exTests||{})[exId]||[];
const zielOf=t=>P().ziele.find(z=>z.test===t.test&&(z.side||'')===(t.side||''))||null;
// Seite der Absicht (Entscheidung 02.10.2026): l/r fest, b beide Seiten, a Seite der Ausführung, g Gegenseite (a und g bei getrennten Übungen).
// a und g ergeben sich aus der Ausführung: Plan-Position „nur links“/„nur rechts“/„beide Seiten“; ohne bekannte Ausführung beide Seiten.
const SEITE_FOLGT=['a','g','b'];
const sdSides=sd=>sd==='L'?['l']:sd==='R'?['r']:['l','r'];
const planSides=exId=>{const o=new Set();P().blocks.forEach(b=>b.items.forEach(([id,,sd])=>{if(id===exId)sdSides(sd).forEach(x=>o.add(x))}));return ['l','r'].filter(x=>o.has(x))};
const intentSides=(t,ausf)=>{const s=t.side||'';if(!s)return [''];if(s==='l'||s==='r')return [s];if(s==='b')return ['l','r'];
  const a=ausf&&ausf.length?ausf:['l','r'];return s==='g'&&a.length===1?[a[0]==='l'?'r':'l']:a};
// Name mit ermittelter Seite: „SLR rechts“, bei beiden Seiten „SLR L/R“
const sideName=(test,ss)=>testShort(test)+(ss.length===2?' L/R':ss[0]==='l'?' links':ss[0]==='r'?' rechts':'');
const planSideLbl=ps=>!ps.length?'nicht im Plan':ps.length===2?'im Plan: beide Seiten':ps[0]==='l'?'im Plan: links':'im Plan: rechts';
function exTestsLine(e,sd){const ts=exTests(e.id);const lb='<span class="gl">soll verbessern:</span> ';
  if(!ts.length)return lb+'wählen';
  const t=ts[0],ss=intentSides(t,sdSides(sd));
  const mehr=ts.slice(1).map(x=>' · '+nw('+ '+sideName(x.test,intentSides(x,sdSides(sd))))).join('');
  if(ss.length===1){const k={test:t.test,side:ss[0]},z=zielOf(k);return lb+esc(sideName(t.test,ss))+(z?' · '+nw('Ziel '+goalVal(z.test,z.target)):'')+' · '+nw(goalLast(k))+mehr}
  return lb+esc(testShort(t.test))+ss.map(x=>{const k={test:t.test,side:x},z=zielOf(k);return ' · '+nw((x==='l'?'L ':'R ')+(z?'Ziel '+goalVal(z.test,z.target)+' ':'')+goalLast(k))}).join('')+mehr}
// Ziel anlegen (z=null) oder ändern; after() zeichnet das Plan-Sheet neu
function goalSheet(z,after){
  let test=z?z.test:null, side=z?(z.side||'l'):'l', val=z?z.target:null, pick=!z;
  const unit=()=>(testOf(test)||{}).u||'';
  const yn=()=>unit()==='ja/nein';
  const stepOf=()=>/°/.test(unit())?5:1;
  // Startwert bei neuer Testwahl: letzter Messwert in der Einheit des Tests, sonst 0
  const startVal=()=>{if(yn())return 'ja';const raw=lastTestVal(test,side||'l');if(/°/.test(unit())&&/cm/.test(String(raw||'')))return 0;const n=testNum(raw)??0;return stepOf()===5?Math.round(n/5)*5:n};
  const draw=()=>{
    const single=test&&testSingle(test);
    const list=`<div class="list">${TESTS.map((t,i)=>`<button class="item" style="width:100%;text-align:left" data-gt="${i}"><div class="t"><b${t.n===test?' style="color:var(--accent)"':''}>${esc(t.n)}</b></div><span class="badge">${t.g}</span></button>`).join('')}</div>`;
    openSheet(`<h3>${z?'Ziel ändern':'Neues Ziel'}</h3>
    ${pick?`<div class="lbl">Test</div>${list}`:`<button class="goalpick" id="gtest"><span>Test: <b>${esc(testShort(test))}</b> <span class="go">· ändern</span></span></button>
    ${single?'':`<div class="row between"><span class="lbl">Seite</span><div class="chips">${[['l','links'],['r','rechts']].map(([k,l])=>`<button class="chip sm ${side===k?'on':''}" data-gs="${k}">${l}</button>`).join('')}</div></div>`}
    <div class="row between"><span class="lbl">Zielwert</span>${yn()?`<div class="chips">${['ja','nein'].map(x=>`<button class="chip ${val===x?'on':''}" data-gyn="${x}">${x}</button>`).join('')}</div>`
      :`<div class="step"><button data-gv="-1" aria-label="Zielwert weniger">−</button><span id="gval">${goalVal(test,val)}</span><button data-gv="1" aria-label="Zielwert mehr">+</button></div>`}</div>
    <div class="hint">Der letzte Messwert erscheint neben dem Ziel.</div>
    <button class="btn primary wide" id="gsave">Speichern</button>${z?'<button class="btn danger wide" id="gdel">Ziel löschen</button>':''}`}`);
    document.querySelectorAll('#sheet [data-gt]').forEach(b=>b.onclick=()=>{const t=TESTS[+b.dataset.gt];if(t.n!==test){test=t.n;if(testSingle(test))side='';else if(!side)side='l';val=startVal()}pick=false;draw()});
    if(pick)return;
    document.getElementById('gtest').onclick=()=>{pick=true;draw()};
    document.querySelectorAll('#sheet [data-gs]').forEach(b=>b.onclick=()=>{side=b.dataset.gs;document.querySelectorAll('#sheet [data-gs]').forEach(c=>c.classList.toggle('on',c===b))});
    document.querySelectorAll('#sheet [data-gyn]').forEach(b=>b.onclick=()=>{val=b.dataset.gyn;document.querySelectorAll('#sheet [data-gyn]').forEach(c=>c.classList.toggle('on',c===b))});
    document.querySelectorAll('#sheet [data-gv]').forEach(b=>b.onclick=()=>{val=Math.max(0,(typeof val==='number'?val:0)+(+b.dataset.gv)*stepOf());document.getElementById('gval').textContent=goalVal(test,val)});
    document.getElementById('gsave').onclick=()=>{
      const nz={test,side:testSingle(test)?'':side,target:val};
      if(z){if(z.test===nz.test&&z.side===nz.side&&z.target===nz.target){toast('Ziel unverändert');after();return}Object.assign(z,nz)}
      else{const p=P();let n=(p.zseq||0)+1;while(p.ziele.some(x=>x.id==='z'+n))n++;p.zseq=n;p.ziele.push(Object.assign({id:'z'+n},nz))}
      addEvent(`Ziel: ${goalName(nz)} ${goalVal(test,val)} ${z?'geändert':'angelegt'}`);save();toast('Ziel gespeichert');after()};
    const del=document.getElementById('gdel');
    // Löschen lässt die Absicht der Übungen (S.exTests) unverändert
    if(del)del.onclick=()=>confirmSheet(`Ziel ${esc(goalName(z))} löschen?`,()=>{P().ziele=P().ziele.filter(x=>x.id!==z.id);
        addEvent(`Ziel: ${goalName(z)} ${goalVal(z.test,z.target)} gelöscht`);save();toast('Ziel gelöscht');after()},'Löschen');
  };
  draw();
}
// Absicht der Übung bearbeiten: Liste mit „primär“, „↑“, „−“ und „+ Test“; Übernehmen schreibt S.exTests, Abbruch über den Hintergrund verwirft
function exTestsSheet(e,after){
  const orig=exTests(e.id).map(t=>({test:t.test,side:t.side||''}));
  let list=orig.map(t=>Object.assign({},t)), pick=false, test=null;
  const draw=()=>{
    const rows=list.map((t,i)=>`<div class="item goal"><div class="t"><b>${esc(goalName(t))}</b>${i===0?' <span class="badge">primär</span>':''}</div>${i>0?`<button class="chip sm" data-xtup="${i}" aria-label="${esc(goalName(t))} primär machen">↑</button>`:''}<button class="chip sm" data-xtrm="${i}" aria-label="${esc(goalName(t))} entfernen">−</button></div>`).join('')||'<div class="hint">Noch kein Test gewählt.</div>';
    const tl=`<div class="list">${TESTS.map((t,i)=>`<button class="item" style="width:100%;text-align:left" data-xt="${i}"><div class="t"><b>${t.n}</b><small>${t.u}</small></div><span class="badge">${t.g}</span></button>`).join('')}</div>`;
    openSheet(`<h3>Soll verbessern · ${esc(e.name)}</h3><div class="list">${rows}</div>
    ${test?`<div class="row between"><span class="lbl">Seite · ${esc(testShort(test))}</span><div class="chips">${(e.side==='getrennt'?[['a','Seite der Ausführung'],['g','Gegenseite']]:[['l','links'],['r','rechts'],['b','beide']]).map(([k,l])=>`<button class="chip sm" data-xs="${k}">${l}</button>`).join('')}</div></div>`
      :pick?`<div class="lbl">Test</div>${tl}`:'<button class="btn ghost wide" id="xtAdd">+ Test</button>'}
    <button class="btn primary wide" id="xtSave">Übernehmen</button>`);
    const add=t=>{if(list.some(x=>x.test===t.test&&x.side===t.side))toast('Schon gewählt');else list.push(t);pick=false;test=null;draw()};
    document.querySelectorAll('#sheet [data-xtrm]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.xtrm,1);draw()});
    document.querySelectorAll('#sheet [data-xtup]').forEach(b=>b.onclick=()=>{const [t]=list.splice(+b.dataset.xtup,1);list.unshift(t);draw()});
    document.querySelectorAll('#sheet [data-xt]').forEach(b=>b.onclick=()=>{const n=TESTS[+b.dataset.xt].n;if(testSingle(n))add({test:n,side:''});else{test=n;pick=false;draw()}});
    document.querySelectorAll('#sheet [data-xs]').forEach(b=>b.onclick=()=>add({test,side:b.dataset.xs}));
    const xa=document.getElementById('xtAdd');if(xa)xa.onclick=()=>{pick=true;draw()};
    document.getElementById('xtSave').onclick=()=>{
      if(JSON.stringify(list)===JSON.stringify(orig)){toast('Unverändert');after();return}
      S.exTests=S.exTests||{};if(list.length)S.exTests[e.id]=list;else delete S.exTests[e.id];
      addEvent(`${e.name} soll verbessern: ${list.map(goalName).join(', ')||'nichts gewählt'}`);save();toast('Gespeichert');after()};
  };
  draw();
}
// Einen Test messen (Assessment, Einzeltest, Test-Retest). opts: {title, hint, initial:{l,r} (gespeicherte Form, z. B. 60, „6 cm“, „ja“), cb(val)};
// optional saveLabel, onSkip (Knopf „überspringen“), note (Notizfeld). val = {l, r} wie in D().tests, einseitig r:'–'
function measureSheet(t,opts){
  const yn=t.u==='ja/nein', mixed=t.u==='° / cm';
  const single=testSingle(t.n);
  const sides=single?[['l','Wert']]:[['l','Links'],['r','Rechts']];
  const init=opts.initial||{};
  const st={u:mixed?(/cm/.test(String(init.l||''))?'cm':'°'):t.u,typed:false};
  const startOf=sd=>{const raw=init[sd];if(yn)return raw==='ja'||raw==='nein'?raw:null;if(mixed&&raw!=null&&(/cm/.test(String(raw))?'cm':'°')!==st.u)return 0;return testNum(raw)??0};
  sides.forEach(([sd])=>st[sd]=startOf(sd));
  const stepOf=()=>st.u==='°'?5:1;
  const show=v=>v==null?'–':st.u==='°'?v.toLocaleString('de-DE')+'°':v.toLocaleString('de-DE')+' '+st.u;
  const store=v=>v==null?'–':yn?v:st.u==='°'?(mixed?v+'°':v):v.toLocaleString('de-DE')+' '+st.u;
  const sideRow=([sd,l])=>yn?`<div class="row between"><span class="lbl">${l}</span><div class="chips">${['ja','nein'].map(x=>`<button class="chip ${st[sd]===x?'on':''}" data-tyn="${sd}:${x}">${x}</button>`).join('')}</div></div>`
    :`<div class="row between"><span class="lbl">${l}</span><div class="step"><button data-ts="${sd}:-1" aria-label="${l} weniger">−</button><span id="tv-${sd}">${show(st[sd])}</span><button data-ts="${sd}:1" aria-label="${l} mehr">+</button></div></div>
      <input type="text" inputmode="decimal" id="tin-${sd}" placeholder="${l} in ${st.u}" hidden>`;
  const hint=opts.hint!=null?opts.hint:(t.g==='Table'?'Table Test, Grad in 5°-Schritten':t.g==='Bewegung'?'Bewegungstest, Abstand in cm':'Eigener Test')+(yn?'':' · vorbelegt mit dem letzten Wert');
  openSheet(`<h3>${esc(opts.title)}</h3><div><b>${t.n}</b><div class="hint">${esc(hint)}</div></div>
  ${mixed?`<div class="row"><span class="lbl">Einheit</span><span class="seg"><button data-tu="°" class="${st.u==='°'?'on':''}">Grad</button><button data-tu="cm" class="${st.u==='cm'?'on':''}">cm</button></span><span class="hint">solange Beine abheben: cm</span></div>`:''}
  <div class="stack" id="tsides">${sides.map(sideRow).join('')}</div>
  ${yn?'':'<button class="chip sm" id="ttype" style="align-self:flex-start">Wert tippen</button>'}
  ${opts.note?'<input type="text" id="tn" placeholder="Notiz">':''}<div class="row"><button class="btn primary" id="tsave">${opts.saveLabel||'Speichern'}</button>${opts.onSkip?'<button class="btn ghost" id="tskip">überspringen</button>':''}</div>`);
  const upd=sd=>{const e=document.getElementById('tv-'+sd);if(e)e.textContent=show(st[sd])};
  document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{const [sd,dv]=b.dataset.ts.split(':');st[sd]=Math.max(0,Math.round(((st[sd]||0)+(+dv)*stepOf())*10)/10);upd(sd);const inp=document.getElementById('tin-'+sd);if(inp&&!inp.hidden)inp.value=String(st[sd]).replace('.',',')});
  document.querySelectorAll('[data-tyn]').forEach(b=>b.onclick=()=>{const [sd,x]=b.dataset.tyn.split(':');st[sd]=st[sd]===x?null:x;document.querySelectorAll(`[data-tyn^="${sd}:"]`).forEach(c=>c.classList.toggle('on',c.dataset.tyn===sd+':'+st[sd]))});
  document.querySelectorAll('[data-tu]').forEach(b=>b.onclick=()=>{if(st.u===b.dataset.tu)return;st.u=b.dataset.tu;document.querySelectorAll('[data-tu]').forEach(x=>x.classList.toggle('on',x===b));sides.forEach(([sd])=>{st[sd]=startOf(sd);upd(sd);const inp=document.getElementById('tin-'+sd);if(inp){inp.placeholder=inp.placeholder.replace(/in .*$/,'in '+st.u);inp.value=''}})});
  const tt=document.getElementById('ttype');
  if(tt)tt.onclick=()=>{st.typed=!st.typed;tt.textContent=st.typed?'Stepper nutzen':'Wert tippen';sides.forEach(([sd])=>{const inp=document.getElementById('tin-'+sd);inp.hidden=!st.typed;if(st.typed)inp.value=String(st[sd]??'').replace('.',',')});if(st.typed){const f=document.getElementById('tin-l');if(f)f.focus()}};
  sides.forEach(([sd])=>{const inp=document.getElementById('tin-'+sd);if(inp)inp.oninput=()=>{const v=testNum(inp.value);if(v!=null){st[sd]=Math.max(0,v);upd(sd)}}});
  document.getElementById('tsave').onclick=()=>opts.cb({l:store(st.l),r:single?'–':store(st.r)});
  const sk=document.getElementById('tskip'); if(sk)sk.onclick=opts.onSkip;
}
function testSheet(list){
  let i=0; const vals=[];
  const draw=()=>{const t=list[i];
    measureSheet(t,{title:list.length>1?`Assessment ${i+1}/${list.length}`:'Einzeltest',initial:{l:lastTestVal(t.n,'l'),r:lastTestVal(t.n,'r')},
      saveLabel:i<list.length-1?'Weiter':'Speichern',note:true,onSkip:next,cb:val=>{vals.push({n:t.n,l:val.l,r:val.r});next()}})};
  const next=()=>{i++;if(i<list.length)draw();else{D().tests.push(...vals);closeSheet();toast(vals.length+(vals.length===1?' Test':' Tests')+' gespeichert');setTab('bib');openBibSheet('tests')}};
  draw();
}
// ---------- Test-Retest an der Übung (it.rt = {test, vor:{l,r}, nach:{l,r}|null}) ----------
// Richtung: bei „°“ und „s“ ist höher besser, bei „cm“ niedriger; ja/nein ohne Richtung
function rtUnit(n,v){if(v==='ja'||v==='nein')return 'yn';const s=String(v);if(/cm/.test(s))return 'cm';if(/\ss$/.test(s))return 's';const u=(testOf(n)||{}).u||'';return u==='ja/nein'?'yn':u==='cm'?'cm':u==='s'?'s':/°/.test(u)?'°':u}
function rtDelta(n,a,b,bare){const ua=rtUnit(n,a),ub=rtUnit(n,b);if(ua==='yn'||ua!==ub)return '';const x=testNum(a),y=testNum(b);if(x==null||y==null)return '';
  const d=Math.round((y-x)*10)/10;const txt=d>0?'+'+d.toLocaleString('de-DE'):d<0?'−'+(-d).toLocaleString('de-DE'):'±0';
  const c=d===0?'':(ua==='cm'?d<0:d>0)?' up':' down';return `<span class="delta${c}">${bare?txt:'('+txt+')'}</span>`}
const rtSingle=rt=>rt.vor.r==='–'||testSingle(rt.test);
// Seiten eines Paars: [Kürzel, vorher, nachher]; einseitig ohne „L“
const rtSides=rt=>rtSingle(rt)?[['',rt.vor.l,rt.nach&&rt.nach.l]]:[['L',rt.vor.l,rt.nach&&rt.nach.l],['R',rt.vor.r,rt.nach&&rt.nach.r]];
// „L 60° → 65° (+5) · R 70° → 70° (±0)“ bzw. „vorher L 60° · R 70°“
function rtText(rt){const v=x=>esc(goalVal(rt.test,x));
  if(!rt.nach)return 'vorher '+rtSides(rt).map(([s,a])=>(s?s+' ':'')+v(a)).join(' · ');
  return rtSides(rt).map(([s,a,b])=>`${s?s+' ':''}${v(a)} → ${v(b)}${(d=>d?' '+d:'')(rtDelta(rt.test,a,b))}`).join(' · ')}
// kurz für die Übungskarte: „L 60→65 (+5) · R 70→70 (±0)“
function rtShort(rt){const v=x=>{const n=testNum(x);return n==null||x==='ja'||x==='nein'?esc(x):n.toLocaleString('de-DE')};
  return rtSides(rt).map(([s,a,b])=>`<span style="white-space:nowrap">${s?s+' ':''}${v(a)}→${v(b)}${(d=>d?' '+d:'')(rtDelta(rt.test,a,b))}</span>`).join(' · ')}
// alle vollständigen Paare einer Übung aus allen Tagen, chronologisch aufsteigend
function rtPairs(exId){const out=[];Object.keys(S.days).sort().forEach(k=>(S.days[k].done||[]).forEach(a=>(a.ex||[]).forEach(i=>{if(i.id===exId&&i.rt&&i.rt.nach)out.push({k,rt:i.rt})})));return out}
// „Test davor“: mit dem primären Test der Übung sofort messen, sonst zuerst den Test wählen
function rtStart(it,after){
  const go=t=>measureSheet(t,{title:'Vorher · '+testShort(t.n),hint:'Danach die Übung machen, dann „danach“ messen.',initial:{l:lastTestVal(t.n,'l'),r:lastTestVal(t.n,'r')},
    cb:val=>{it.rt={test:t.n,vor:val,nach:null};closeSheet();after()}});

  document.querySelectorAll('#sheet [data-t1]').forEach(b=>b.onclick=()=>go(TESTS[+b.dataset.t1]));
}
function rtAfter(it,after){const t=testOf(it.rt.test);if(!t)return;
  measureSheet(t,{title:'Nachher · '+testShort(t.n),hint:'Vorbelegt mit dem Wert von vorher.',initial:it.rt.vor,cb:val=>{it.rt.nach=val;closeSheet();after()}})}
// Rettungskiste: Einträge in S.rettung ({id,t,a,x}); „hat geholfen“ merkt die id im Tag (d.helped) und schreibt ins Journal.

const RETT_ARTEN=['Übung','Cue','Notiz','Merksatz'];
const merkDatum=k=>{const d=new Date(k+'T12:00:00');return isNaN(d)?'':fmt(d)+d.getFullYear()};

// Formular mit Titel (input), Text (textarea) und Merksatz (textarea): bei Art Merksatz nur das Merksatz-Feld; beim Wechsel wandert vorhandener Text mit
function rettArtFelder(chips,ti,tx,tm){
  const set=a=>{const m=a==='Merksatz',T=document.getElementById(ti),X=document.getElementById(tx),M=document.getElementById(tm);
    if(m&&!M.value.trim())M.value=[T.value.trim(),X.value.trim()].filter(Boolean).join('\n');

// ---------- Übungsdatei (art:'uebungen', format 1) ----------
// Aufbau: {app:'MF-Log', art:'uebungen', format:1, erstellt:'JJJJ-MM-TT', uebungen:[{name, kategorie:'K'|'I', seite:'beidseitig'|'getrennt',
//   dosis:{saetze, anzahl, einheit:'Wdh'|'s'|'Atemzüge', kg?}, region?, prinzipTags?, video?, status?:'testphase'|'aktiv', cues?, notiz?}]}
// Beschreibung für Menschen und Agenten: app/README.md, Abschnitt „Übungsdatei“. Prüfwerkzeug: app/tools/uebungen-pruefen.js (nutzt pruefeUebungen).
const UEB_FELDER=['name','kategorie','seite','dosis','region','prinzipTags','video','status','cues','notiz'];
const UEB_DOSIS=['saetze','anzahl','einheit','kg'];
const UEB_EINHEITEN=['Wdh','s','Atemzüge'];
const nameKey=v=>String(v||'').trim().toLowerCase();
// Prüft die ganze Datei; liefert {fehler:[Texte], liste:[Übungen im App-Format ohne id]}. Bei Fehlern wird nichts übernommen.
function pruefeUebungen(obj){
  const fehler=[], liste=[];
  if(!obj||typeof obj!=='object'||obj.app!=='MF-Log'||obj.art!=='uebungen')return {fehler:['Keine MF-Log-Übungsdatei'],liste};
  if(obj.format!==1)fehler.push('Unbekanntes Format „'+obj.format+'“, erwartet 1');
  if(!Array.isArray(obj.uebungen)||!obj.uebungen.length){fehler.push('Die Datei enthält keine Übungen');return {fehler,liste}}
  const txt=v=>typeof v==='string';
  obj.uebungen.forEach((u,i)=>{
    const nr='Übung '+(i+1)+(u&&txt(u.name)&&u.name.trim()?' „'+u.name.trim()+'“':'');
    if(!u||typeof u!=='object'||Array.isArray(u)){fehler.push(nr+': kein gültiger Eintrag');return}
    const n0=fehler.length, f=m=>fehler.push(nr+': '+m);
    const fremd=Object.keys(u).filter(k=>!UEB_FELDER.includes(k)); if(fremd.length)f('unbekannte Felder '+fremd.join(', '));
    const name=txt(u.name)?u.name.trim():''; if(!name)f('Name fehlt'); else if(name.length>80)f('Name länger als 80 Zeichen');
    if(!['K','I'].includes(u.kategorie))f('Kategorie muss „K“ (Korrektiv) oder „I“ (Intensiv) sein');
    if(!['beidseitig','getrennt'].includes(u.seite))f('Seite muss „beidseitig“ oder „getrennt“ sein');
    const d=u.dosis;
    if(!d||typeof d!=='object'||Array.isArray(d))f('Dosis fehlt');
    else{
      const df=Object.keys(d).filter(k=>!UEB_DOSIS.includes(k)); if(df.length)f('unbekannte Dosis-Felder '+df.join(', '));
      if(!Number.isInteger(d.saetze)||d.saetze<1||d.saetze>20)f('Sätze müssen eine ganze Zahl von 1 bis 20 sein');
      if(!Number.isInteger(d.anzahl)||d.anzahl<1||d.anzahl>999)f('Anzahl muss eine ganze Zahl von 1 bis 999 sein');
      if(!UEB_EINHEITEN.includes(d.einheit))f('Einheit muss „Wdh“, „s“ oder „Atemzüge“ sein');
      if(d.kg!=null&&(typeof d.kg!=='number'||!isFinite(d.kg)||d.kg<=0||d.kg>500))f('kg muss eine Zahl über 0 sein oder fehlen');
    }
    if(u.region!=null&&!txt(u.region))f('Region muss ein Text sein');
    if(u.prinzipTags!=null&&(!Array.isArray(u.prinzipTags)||u.prinzipTags.some(t=>!pzHas(t))))f('Prinzip-Tags nur aus: '+pzTags().join(', '));
    if(u.video!=null&&!txt(u.video))f('Video muss ein Text sein');
    if(u.status!=null&&!['testphase','aktiv'].includes(u.status))f('Status muss „testphase“ oder „aktiv“ sein');
    if(u.cues!=null&&(!Array.isArray(u.cues)||u.cues.some(c=>!txt(c)||!c.trim())))f('Cues müssen eine Liste nicht leerer Texte sein');
    if(u.notiz!=null&&!txt(u.notiz))f('Notiz muss ein Text sein');
    if(name&&obj.uebungen.slice(0,i).some(v=>v&&nameKey(v.name)===nameKey(name)))f('Name kommt in der Datei doppelt vor');
    if(fehler.length>n0)return;
    const e={name,cat:u.kategorie,region:txt(u.region)?u.region.trim():'',side:u.seite,dose:'',tags:[...new Set(u.prinzipTags||[])],status:u.status||'testphase',
      cues:(u.cues||[]).map(c=>c.trim()),d:{sets:d.saetze,n:d.anzahl,u:d.einheit,...(d.kg!=null?{kg:d.kg}:{})}};
    const vu=normUrl(u.video); if(vu)e.video=vu;
    if(txt(u.notiz)&&u.notiz.trim())e.notiz=u.notiz.trim();
    liste.push(e);
  });
  return {fehler,liste};
}
// Vorschau und Übernahme: neue Übungen hinzufügen, gleichnamige (auch verworfene) überspringen; sonst bleibt alles unverändert
function importUebungen(obj,fname){

    ${alt.length?`<div class="hint" id="uebAlt">Schon vorhanden, werden übersprungen: ${alt.map(e=>esc(e.name)).join(', ')}</div>`:''}
    ${neu.length?`<div class="hint">Fügt nur diese Übungen hinzu. Plan, Tage und alles andere in ${esc(APP_NAME)} bleiben unverändert.</div>
    <div class="row"><button class="btn primary" style="flex:1" id="uebYes">${neu.length===1?'1 Übung hinzufügen':neu.length+' Übungen hinzufügen'}</button></div>`:'<div class="hint">Nichts Neues in der Datei.</div>'}`);
  const yes=document.getElementById('uebYes'); if(!yes)return;
  yes.onclick=()=>{
    let sq=Date.now(); const nextId=()=>{while(EX.some(x=>x.id==='c'+sq)||(S.exDeleted||[]).includes('c'+sq))sq++;return 'c'+(sq++)};
    S.customEx=S.customEx||[]; S.cues=S.cues||{}; S.exNotes=S.exNotes||{};

      EX.push(e); S.customEx.push(e); if(e.cues.length)S.cues[e.id]=e.cues;
      if(notiz)S.exNotes[e.id]=[{d:iso(today),t:notiz}];
      addEvent(e.name+': neu angelegt (Import, '+(e.status==='aktiv'?'aktiv':'Testphase')+')')});
    save(); closeSheet(); render(); toast(neu.length===1?'1 Übung hinzugefügt':neu.length+' Übungen hinzugefügt')};
}
// Import: Datei lesen, prüfen, Vorschau; „Ersetzen“ ist die Entscheidung (ein Dialog)
function importFile(file){
  const rd=new FileReader();
  rd.onerror=()=>toast('Datei nicht lesbar');
  rd.onload=()=>{let obj=null;try{obj=JSON.parse(rd.result)}catch(e){}

    if(obj&&obj.app==='MF-Log'&&obj.art==='uebungen'){importUebungen(obj,file.name);return}
    if(!obj||obj.app!=='MF-Log'||!obj.daten||typeof obj.daten!=='object'){toast('Keine MF-Log-Exportdatei');return}
    const dt=obj.daten, days=Object.values(dt.days||{});
    const nTage=days.filter(d=>d&&(d.tf!=null||(d.done||[]).length||(d.notes||[]).length||(d.tests||[]).length)).length;
    const nEx=exSeed().filter(e=>!(dt.exDeleted||[]).includes(e.id)).length+(dt.customEx||[]).length;
    const nEinh=days.reduce((n,d)=>n+((d&&d.done)||[]).filter(a=>a&&a.ex).length,0);
    const fremd=obj.kanal&&obj.kanal!==KANAL;
    // Beispieldaten dürfen nie in die echte App: eine Datei aus dem Testkanal wird im echten Kanal abgelehnt (Entscheidung 01.10.2026).
    // Umgekehrt bleibt erlaubt: eine echte Datei in den Testkanal, um eine neue Version mit eigenen Daten auszuprobieren.
    const gesperrt=!TEST&&obj.kanal==='test';
    openSheet(`<h3>Import</h3><div class="impbox"><span>Datei: <b>${esc(file.name)}</b></span><span>Exportiert am ${esc(dateDE(obj.exportiert))} · Version ${esc(obj.version||'–')} · Kanal ${esc(obj.kanal||'–')}</span><span><b>${nTage}</b> Tage mit Einträgen · <b>${nEx}</b> Übungen · <b>${nEinh}</b> Einheiten</span></div>
      ${gesperrt?`<div class="warn" id="impBlock">Datei aus MF-Log Test mit Beispieldaten. In MF-Log lässt sie sich nicht importieren, damit keine Beispieldaten zu deinen echten Daten kommen. Importiere hier nur Dateien, die du in MF-Log exportiert hast.</div>`
      :`${fremd?`<div class="warn">Die Datei stammt aus dem Kanal „${esc(obj.kanal)}“, geöffnet ist „${esc(KANAL)}“.</div>`:''}
      <div class="hint">„Ersetzen“ löscht den jetzigen Stand in ${esc(APP_NAME)} und übernimmt die Datei. Vorher exportieren, wenn du den jetzigen Stand behalten willst.</div>
      <div class="row"><button class="btn primary" style="flex:1" id="impYes">Ersetzen</button></div>`}`);
    if(gesperrt)return;
    document.getElementById('impYes').onclick=()=>{const alt=JSON.stringify(S);
      try{hydrate(JSON.parse(JSON.stringify(dt)));S.tab='heute';S.session=null;S.sessShow=false;stopTimer();save();closeSheet();applyTheme();setTab('heute');toast('Import übernommen')}
      catch(e){hydrate(JSON.parse(alt));closeSheet();render();toast('Import fehlgeschlagen, alter Stand bleibt')}}};
  rd.readAsText(file);
}
// Erscheinungsbild: System (ohne Attribut), Hell, Dunkel; CSS kennt data-theme auf <html>
function applyTheme(){const t=S&&S.theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
function mehrSheet(){
  const age=exportAge(); const th=S.theme||'system';
  openSheet(`<h3>Mehr</h3>
    <div class="setrow"><div class="kv"><b>Kanal</b><span>${esc(APP_NAME)}${TEST?' (Beispieldaten)':''}</span><b>Version</b><span>${APP_VERSION}</span>${NATIVE?`<b>Hülle</b><span id="huelleVer">${esc(huelleVersion())}</span>`:''}<b>Letzter Export</b><span id="lastExp">${S.lastExport?esc(dateDE(S.lastExport))+(age?` (vor ${age} Tag${age===1?'':'en'})`:' (heute)'):'noch nie'}</span></div></div>
    <div class="setrow"><div class="lbl">Daten sichern</div><div class="row"><button class="btn primary" id="expBtn">Exportieren</button><button class="btn ghost" id="impBtn">Importieren</button></div>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
      <div class="hint">Export als JSON-Datei, z. B. zum Ablegen in Google Drive. Import einer Sicherung ersetzt den ganzen Stand dieses Kanals; eine Übungsdatei fügt nur Übungen hinzu.</div></div>
    <div class="setrow"><div class="lbl">Erscheinungsbild</div><div class="seg" id="themeSeg">${[['system','System'],['light','Hell'],['dark','Dunkel']].map(([k,l])=>`<button data-theme-set="${k}" class="${th===k?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="setrow" style="margin-top:18px">${TEST?'<button class="btn danger wide" id="resetBtn">Beispieldaten zurücksetzen</button>':'<button class="btn danger wide" id="wipeBtn">Alle Daten löschen</button>'}</div>`);
  // nach dem Export „Mehr“ neu zeichnen (Letzter Export: heute); mit Hülle erst nach dem Rückruf {ok:true} und nur, wenn das Sheet noch offen ist
  document.getElementById('expBtn').onclick=()=>exportData(()=>{if(document.getElementById('expBtn'))mehrSheet()});
  const fi=document.getElementById('impFile');
  document.getElementById('impBtn').onclick=()=>fi.click();
  fi.onchange=()=>{const f=fi.files&&fi.files[0];if(f)importFile(f)};
  document.querySelectorAll('#themeSeg [data-theme-set]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.themeSet;applyTheme();save();mehrSheet()});
  const rb=document.getElementById('resetBtn');
  if(rb)rb.onclick=()=>confirmSheet('Alle Eingaben löschen und Beispieldaten neu laden?',()=>{const th=S.theme;try{localStorage.removeItem(STORE_KEY)}catch(e){}stopTimer();load();if(th)S.theme=th;render();toast('Zurückgesetzt')},'Zurücksetzen');
  const wb=document.getElementById('wipeBtn');
  if(wb)wb.onclick=()=>confirmSheet('Alle Daten löschen?',()=>{const th=S.theme;try{localStorage.removeItem(STORE_KEY)}catch(e){}stopTimer();load();if(th)S.theme=th;S.lastExport=null;render();toast('Alle Daten gelöscht')},'Löschen',
    `<div class="warn">Tage, Übungen, Plan, Tests und Rettungskiste werden gelöscht. Das lässt sich nicht rückgängig machen. ${S.lastExport?'Letzter Export: '+esc(dateDE(S.lastExport))+'.':'Du hast noch nie exportiert.'} Vorher unter „Exportieren“ sichern.</div>`);
}

// ---------- Service Worker, Update-Hinweis, dauerhafter Speicher, Tageswechsel ----------
function initPwa(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
  if(!('serviceWorker' in navigator))return;
  const row=document.getElementById('updRow'); let waiting=null, wantReload=false;
  const show=w=>{waiting=w;row.hidden=false};
  row.onclick=()=>{if(!waiting)return;wantReload=true;waiting.postMessage({type:'skipWaiting'})};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(wantReload){wantReload=false;location.reload()}});
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)show(nw)})});
      // beim Zurückkehren in die App nach Updates sehen
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
    }).catch(()=>{});
  });
}
// Die installierte App bleibt oft über Nacht geöffnet; „heute“ ist beim Laden festgelegt, deshalb bei neuem Tag neu laden
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const n=new Date();n.setHours(12,0,0,0);if(iso(n)!==iso(today)){save();location.reload()}});

load(); applyTheme(); render(); initPwa(); initNative();
if(loadFehler)setTimeout(()=>toast('Gespeicherte Daten nicht lesbar. Kopie unter '+STORE_KEY+'-defekt.'),300);
</script>
