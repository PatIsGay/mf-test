<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MF-Log</title>
<meta name="theme-color" content="#2F6B3F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F6F5F0; --surface:#FFFFFF; --surface2:#EFEEE7; --line:#DDDBD1; --ink:#1E2A22; --ink2:#5B6660; --ink3:#8B948E;
    --accent:#2F6B3F; --accent-ink:#FFFFFF; --accent-soft:#DDEBDF;
    --k:#D9EAD3; --k-ink:#2F5A2A; --i:#6AA84F; --i-ink:#FFFFFF; --pause:#C9C9C4; --pause-ink:#444;
    --tennis:#E0644F; --laufen:#F0A23A; --kochen:#4A7BD0; --buero:#7A8BA6; --hbuero:#B4BFCF;
    --g0:#3F9A57; --g1:#8CC15E; --g2:#E4B93B; --g3:#EE8A3A; --g4:#D9483B;
    --m0:#CFE6D2; --m1:#DDE8BE; --m2:#F3E4AE; --m3:#F5CDA8; --m4:#F0B5AE; --line2:#EDEBE3;
    --focus:#2F6B3F; --shadow:0 6px 24px rgba(30,42,34,.12);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#151A17; --surface:#1F2622; --surface2:#28302B; --line:#37403A; --ink:#EEF1EC; --ink2:#B4BDB6; --ink3:#7E8781;
      --accent:#7FC08F; --accent-ink:#0F1A12; --accent-soft:#25382B;
      --k:#3A5A35; --k-ink:#D9EAD3; --i:#5E9A45; --pause:#4A4F4B; --pause-ink:#E0E0E0; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark; --m0:#3E6A48; --m1:#5A6E3A; --m2:#7A6A2A; --m3:#7A4E2A; --m4:#7A3A34; --line2:#2E3631; --syink:#EEF1EC;
    }
  }
  :root[data-theme="dark"]{
    --bg:#151A17; --surface:#1F2622; --surface2:#28302B; --line:#37403A; --ink:#EEF1EC; --ink2:#B4BDB6; --ink3:#7E8781;
    --accent:#7FC08F; --accent-ink:#0F1A12; --accent-soft:#25382B;
    --k:#3A5A35; --k-ink:#D9EAD3; --i:#5E9A45; --pause:#4A4F4B; --pause-ink:#E0E0E0; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark; --m0:#3E6A48; --m1:#5A6E3A; --m2:#7A6A2A; --m3:#7A4E2A; --m4:#7A3A34; --line2:#2E3631; --syink:#EEF1EC;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;padding:0}
  button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
  @media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
  .top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
  .top .sub{font-size:13px;color:var(--ink2)}
  .top .menu{font-size:12px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px}
  .proto{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:center;padding:4px 16px 0}
  main{flex:1;padding:12px 16px 110px;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h2{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .stack{display:flex;flex-direction:column;gap:10px}
  .lbl{font-size:13px;color:var(--ink2);font-weight:600}
  .hint{font-size:12px;color:var(--ink2)}
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
  .scale button{aspect-ratio:1/1.05;border-radius:8px;background:var(--surface2);font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid transparent}
  .scale button.on{color:#fff;border-color:transparent}
  .scale button.on.c0{background:var(--g0)}.scale button.on.c1{background:var(--g1)}.scale button.on.c2{background:var(--g2);color:#2a2a2a}.scale button.on.c3{background:var(--g3)}.scale button.on.c4{background:var(--g4)}
  .anchors{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:4px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--surface);color:var(--ink2)}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .chip.sm{padding:3px 9px;font-size:12px}
  /* Kalender „Zeilen“: kompakt und hell, damit die Chipzeile ruhig bleibt */
  #rowChips{gap:6px 4px;margin-top:-6px}
  #rowChips .chip{padding:2px 6px;font-size:11px}
  #rowChips .chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
  .step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .step button{width:38px;height:36px;font-size:18px;font-weight:700;background:var(--surface2)}
  .step span{min-width:64px;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--surface2);color:var(--ink)}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;border:1px solid var(--line)}
  .btn.wide{width:100%}
  .btn.danger{color:var(--g4);box-shadow:inset 0 0 0 1px var(--g4);background:transparent}
  .btn.danger.wide{margin-top:6px}
  .btn[disabled]{opacity:.4;pointer-events:none}
  input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);}
  textarea{min-height:64px;resize:vertical}
  .symrow{display:grid;grid-template-columns:118px 1fr;gap:8px;align-items:center}
  .symrow .lbl{font-size:12px}
  .symrow .scale{gap:3px}
  .symrow .scale button{font-size:11px;border-radius:6px}
  .symrow .scale button.ghost{opacity:.45}
  .tf{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:7px;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;color:#fff}
  .tf.c0{background:var(--g0)}.tf.c1{background:var(--g1)}.tf.c2{background:var(--g2);color:#2a2a2a}.tf.c3{background:var(--g3)}.tf.c4{background:var(--g4)}
  .tf.none{background:var(--surface2);color:var(--ink3)}
  .act{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700}
  .act.K{background:var(--k);color:var(--k-ink)}.act.I{background:var(--i);color:#fff}.act.Pause{background:var(--pause);color:var(--pause-ink)}
  .act.Tennis{background:var(--tennis);color:#fff}.act.Laufen{background:var(--laufen);color:#222}.act.Kochen{background:var(--kochen);color:#fff}.act.Buero{background:var(--buero);color:#fff}.act.HalbBuero{background:var(--hbuero);color:#222}
  .list{display:flex;flex-direction:column}
  .item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .item .t{flex:1;min-width:0}
  .item .t b{display:block;font-weight:700}
  .item .t small{color:var(--ink2);font-size:12px}
  .item .t small .st{font-size:13px;font-weight:600;color:var(--ink)}
  .item .t small .st.ok{color:var(--accent);font-weight:700}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;pointer-events:none}
  nav.tabs .bar{pointer-events:auto;width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:11px;font-weight:700;color:var(--ink3)}
  nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
  nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
  .sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 24px);max-height:none;border-radius:18px 18px 0 0}
  /* Griff: 4 px Balken, 48 px breit, darüber 12 px Ziehfläche; zieht das Sheet nach unten (Wischen schließt) */
  .sheet .grab{flex:0 0 auto;width:48px;height:16px;padding-top:12px;margin:-14px auto 4px;background:var(--line);background-clip:content-box;border-radius:0 0 2px 2px;position:relative;touch-action:none;cursor:grab}
  .sheet .grab::before{content:'';position:absolute;inset:0 -40px -6px}
  .sheet{overscroll-behavior:contain}
  .sheet.drag{transition:none}
  .sheet.snap{transition:transform .15s}
  @media (prefers-reduced-motion:reduce){.sheet.snap{transition:none}}
  .sheet h3{margin:0;font-size:17px;font-weight:800}
  .ex{border-top:1px solid var(--line);padding:10px 0}
  .ex:first-child{border-top:0}
  .ex .head{display:flex;gap:8px;align-items:flex-start}
  .ex .name{flex:1;min-width:0;text-align:left}
  .ex .name b{display:block;font-weight:700}
  .ex .nm{text-align:left;width:100%}
  .ex .name small{display:block}
  .ex .name small{color:var(--ink2);font-size:12px}
  .ex .rate{display:flex;gap:3px;align-items:center}
  .ex .rate button{width:44px;height:40px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);font-size:18px;font-weight:800}
  .ex .rate button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .ex .rate button.pain{width:44px;height:40px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);font-weight:800;margin-left:6px}
  .ex .rate button.pain.on{background:var(--g4);border-color:var(--g4);color:#fff}
  .ex.done .name b{color:var(--ink2)}
  .ex.done .nm b::before{content:'✓ ';color:var(--accent);font-weight:800}
  .ex{position:relative;touch-action:pan-y;transition:transform .15s}
  .ex.drag{transition:none}
  #exlist{overflow-x:clip}
  .ex .swhint{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--ink3);opacity:0;pointer-events:none}
  .ex .swhint.l{right:calc(100% + 10px);color:var(--g3)}
  .ex .swhint.r{left:calc(100% + 10px);color:var(--accent)}
  .ex.showl .swhint.l,.ex.showr .swhint.r{opacity:1}
  .ex.skipped .name b::before{content:'– ';color:var(--ink3)}
  @media (prefers-reduced-motion:reduce){.ex{transition:none}}
  .ex.skipped{opacity:.55}
  .ex .body{display:none;padding:8px 0 0;gap:8px;flex-direction:column}
  .ex.open .body{display:flex}
  .cue{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--surface2)}
  .dchip{font:inherit;font-size:12px;color:var(--ink2);text-decoration:underline dotted;text-underline-offset:3px}
  .goalline{position:relative;display:block;font-size:12px;color:var(--ink2);text-align:left;padding:3px 0 0}
  .goalline .gl{font-size:11px;color:var(--ink2)}
  .goalline.none{color:var(--ink3)}
  button.goalline{padding:4px 0 2px}
  .item.goal{width:100%;text-align:left;font-size:14px;padding:9px 0}
  .item.goal .t b{display:inline;font-weight:600}
  .item.goal .go,.goalpick .go{color:var(--ink3);font-size:13px;font-weight:600}
  .goalpick{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
  /* Dosis im Training: Chip-Knopf, Tipp öffnet „Heute abweichend“ */
  .chip.dose{display:inline-flex;align-items:center;min-height:28px;font-size:12px;color:var(--ink);margin-top:3px;border-radius:14px;text-align:left}
  .ex .sidet{white-space:nowrap}
  .chip.dose.dev{border-color:var(--accent);color:var(--accent)}
  .cue.p{color:var(--ink2)}
  /* Cues im Training: nur aufgeklappt, im Kasten oben im body, vollständig ohne Zeilenbegrenzung */
  .cuebox{display:flex;flex-direction:column;gap:4px;background:var(--surface2);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px}
  .cueline{display:block;width:100%;padding:1px 0 1px 14px;font:inherit;font-size:14px;font-weight:500;line-height:1.35;color:var(--ink);text-align:left;white-space:normal;overflow-wrap:anywhere}
  .cueline::before{content:'•';position:absolute;left:2px}
  .cueline.p{font-size:13px;font-weight:400;color:var(--ink2)}
  .cuetag{margin-top:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
  .cuenone{font-size:14px;color:var(--ink2)}
  .ex .cuecnt{white-space:nowrap}
  .ex .head{cursor:pointer;min-height:44px}
  .ex.open .head .name b{color:var(--accent)}
  button.cue.edit{text-align:left;width:100%;font:inherit;font-size:13px;color:inherit}
  button.cue.edit:active{outline:2px solid var(--accent)}
  /* Ziehen zum Sortieren (Cues auf der Übungskarte, Übungen im Block): nur der Griff startet das Ziehen */
  .sortlist{display:flex;flex-direction:column;gap:6px}
  .sortrow{position:relative;display:flex;align-items:center;gap:6px;transition:transform .15s}
  .sortrow .cue.edit{flex:1;min-width:0}
  .sortrow.dragging{transition:none;z-index:3;background:var(--surface);box-shadow:var(--shadow);border-radius:8px}
  .dragh{flex:0 0 auto;align-self:stretch;width:28px;min-height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink3);touch-action:none;cursor:grab;position:relative}
  .dragh::before{content:'';position:absolute;inset:-4px -6px}
  .dragh svg{width:10px;height:16px;fill:currentColor}
  .sortrow.dragging .dragh{cursor:grabbing;color:var(--accent)}
  @media (prefers-reduced-motion:reduce){.sortrow{transition:none}}
  details summary{cursor:pointer;font-size:12px;color:var(--ink2);font-weight:600}
  .matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  table.matrix{border-collapse:separate;border-spacing:0;font-family:"IBM Plex Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums}
  table.matrix th,table.matrix td{padding:5px 2px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);white-space:nowrap}
  table.matrix th:first-child,table.matrix td:first-child{border-left:0}
  .tog{font:inherit;font-size:11px;font-weight:700;color:var(--accent);text-align:left}
  .sub{padding-left:10px;font-weight:500;color:var(--ink3)}
  .kv.big{font-size:14px}
  table.matrix tr.sep td{border-top:2px solid var(--line)}
  table.matrix.tests th:first-child,table.matrix.tests td:first-child{min-width:120px;max-width:140px;white-space:normal;line-height:1.25}
  table.matrix th:first-child,table.matrix td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;font-family:Manrope,sans-serif;font-size:11px;font-weight:700;color:var(--ink2);padding-left:8px;z-index:1;min-width:86px;max-width:86px;overflow:hidden;text-overflow:ellipsis}
  table.matrix thead th{font-family:Manrope,sans-serif;font-size:11px;color:var(--ink2);background:var(--surface2)}
  table.matrix th.today{color:var(--accent);background:var(--accent-soft)}
  table.matrix th.pv{box-shadow:inset 0 3px 0 var(--accent)}
  .pvl{display:block;font-size:10px;line-height:1;color:var(--accent);font-weight:800}
  table.matrix td.day.today{background:var(--accent-soft)}
  table.matrix td.day{cursor:pointer;min-width:38px}
  table.matrix .cell{display:flex;gap:2px;justify-content:center}
  table.matrix .sw{display:inline-block;width:14px;height:16px;border-radius:3px;font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:16px;text-align:center;font-weight:600;overflow:hidden}
  table.matrix .sw.K{color:var(--k-ink)}table.matrix .sw.I,table.matrix .sw.Tennis{color:#fff}table.matrix .sw.Pause{color:var(--pause-ink)}table.matrix .sw.Laufen{color:#222}
  table.matrix .sw.K{background:var(--k)}.sw.I{background:var(--i)}.sw.Pause{background:var(--pause)}.sw.Tennis{background:var(--tennis)}.sw.Laufen{background:var(--laufen)}.sw.Kochen{background:var(--kochen)}.sw.Buero{background:var(--buero)}.sw.HalbBuero{background:var(--hbuero)}
  table.matrix .sy{display:inline-block;min-width:22px;padding:1px 3px;border-radius:5px;font-weight:600}
  .sy.c0{background:var(--m0);color:var(--syink,#1F3A26)}.sy.c1{background:var(--m1);color:var(--syink,#2E3A1E)}.sy.c2{background:var(--m2);color:var(--syink,#4A3A0A)}.sy.c3{background:var(--m3);color:var(--syink,#4A2A10)}.sy.c4{background:var(--m4);color:var(--syink,#4A1410)}
  table.matrix th.fut,table.matrix td.fut{background:var(--surface2)}
  table.matrix td.fut .sw{opacity:.6}
  table.month td.day,table.month th{border-left:1px solid var(--line2)}
  table.weeks td:first-child{min-width:78px;max-width:none}
  table.weeks tr.wk{cursor:pointer}
  table.weeks td{font-size:11px}
  table.weeks td.tr{min-width:40px;padding:4px 3px}
  table.weeks td.tr .act{font-size:13px;font-weight:800;padding:3px 9px;min-width:30px;justify-content:center}
  table.weeks td.tr:empty{background:none}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink)}
  .dot.abw{background:var(--g3)}
  tr.sep td{border-top:2px solid var(--line)}
  tr.sum td{background:var(--surface2);font-size:11px;color:var(--ink2)}
  table.month td.day{min-width:0;width:10px;padding:3px 0;border-left:0}
  table.month th{font-size:11px;padding:3px 0;border-left:0;min-width:0}
  table.month th.wb,table.month td.wb{border-left:2px solid var(--ink3)}
  table.month th.today{font-weight:800}
  table.month .cell{gap:1px}
  table.month .sw{width:7px;height:11px;border-radius:2px}
  table.month .cell .sw:nth-child(n+2){width:4px}
  table.month .sy{min-width:8px;width:8px;height:11px;padding:0;display:inline-block;border-radius:2px;font-size:0;overflow:hidden}
  table.month th .dn{font-size:0}
  /* Montag: Datum in 11 px, läuft nach rechts über die schmalen Folgetage, ohne die Spalte zu verbreitern */
  table.month th .dn.mo{font-size:11px;display:inline-block;width:0;overflow:visible;white-space:nowrap;text-align:left;vertical-align:top}
  .land-hint{display:none}
  @media (min-width:640px){
    .app{max-width:900px}
    .top{padding:6px 16px 5px;align-items:center}
    .top>div:first-child{display:flex;align-items:baseline;gap:10px}
    .top h1{font-size:18px}
    .proto{padding-top:2px}
    nav.tabs .bar{max-width:900px}
    table.month td.day{width:auto;min-width:24px;padding:4px 2px;border-left:1px solid var(--line)}
    table.month th{min-width:24px;border-left:1px solid var(--line)}
    table.month th .dn{font-size:11px}
    table.month th .dn.mo{font-size:11px;font-weight:800;color:var(--ink);width:auto;display:inline}
    table.month .sw{width:10px;height:14px}

// Liefert immer ein Promise mit {ok, error?, data?}; wirft nie. Aufruf als Methode von NATIVE (die Java-Brücke braucht das Objekt als this).
function nativeCall(m,...args){
  const nein=e=>{try{console.warn('MFNative.'+m+': '+e)}catch(x){}return {ok:false,error:e}};

function seedDays(){
  const days={};
  // deterministisch: 21 Tage zurück
  const tfs=[4,5,4,3,4,6,5,3,4,5,6,7,5,4,3,4,6,7,5,4,3,3,4,5,4,3,4,null];
  const sl=[7,6.5,7.5,8,7,6,6.5,7.5,6,5.5,7,7,8,7.5,7,6.5,6,5.5,7,7.5,8,7,7,6.5,7.5,8,7,null];
  for(let i=27;i>=0;i--){
    const d=addD(today,-i); const k=iso(d); const w=wd(d); const idx=27-i;
    const planned=[...(P().raster[w]||[])];
    let done=[]; let abw=[]; let chips=[];
    if(i>0){
      planned.forEach(p=>{const b=blockById(p); if(!b)return;
        if(b.type==='K') done.push({type:'K',block:b.id,dur:25,rating:4});
        else { if(tfs[idx]>=6){abw.push(b.name+' weggelassen (Tagesform '+tfs[idx]+')')} else done.push({type:'I',block:b.id,dur:35,rating:3}); }
      });
      if(planned.includes('Tennis')) done.push({type:'Tennis',dur:90,int:'hart'});
      if(['Mo','Di','Mi','Do','Fr'].includes(w)) done.push({type: idx%5===2?'HalbBuero':'Buero'});
      if(idx%6===3) done.push({type:'Kochen',dur:120,int:'mittel'});
      if(tfs[idx]>=6) chips.push('Stress'); if(idx%4===1) chips.push('Viel gesessen');
      if(idx===24) abw.push('+ Kniestand (Testphase)');
    }
    const t=tfs[idx];
    const sy = t==null?{}:{s1:Math.max(0,t-2),s2:Math.max(0,t-3),s3:Math.max(0,t-2+(idx%3===0?1:0)),s4:Math.max(0,t-4),s5:Math.max(0,t-3)};
    // Abendwerte an vier Tagen: idx 17 deutlich höher, idx 21 und 25 wie morgens, idx 23 ein Symptom +1
    // „später am Tag“ an den meisten Trainingstagen der letzten zwei Wochen; ein deutlicher Ausreißer am Tag 17
    const later=t!=null&&i>0&&(idx===17||(idx>=13&&done.some(a=>['K','I'].includes(a.type))&&idx%5!==4));
    const syA = idx===17?Object.assign({},sy,{s1:sy.s1+3,s4:sy.s4+2}):later?Object.assign({},sy,idx%3===2?{s3:sy.s3+1}:idx%4===1?{s1:sy.s1+1}:{}):{};
    days[k]={tf:t,tfA:(idx===17?8:null),sleep:sl[idx],sq:(sl[idx]==null?null:sl[idx]>=7?'gut':sl[idx]>=6?'mittel':'schlecht'),sy,syA,extra:[],chips,note:(idx===17?'unruhig geschlafen':''),planned,done,abw,notes:[],tests:[]};
    if(Object.keys(syA).length)days[k].eveningDone=true;
  }
  // Assessment vor 10 Tagen mit drei Tests, damit die Tests-Tabelle eine gemessene Spalte zeigt
  days[iso(addD(today,-10))].tests=[{n:'Gestrecktes Beinheben (SLR)',l:65,r:70},{n:'Hüftaußenrotation',l:40,r:45},{n:'Kniebeuge',l:'5 cm',r:'–'}];
  const tk=iso(today); days[tk].planned=[...(P().raster[wd(today)]||[])]; days[tk].done=[]; days[tk].abw=[]; days[tk].chips=[]; days[tk].sy={}; days[tk].syA={}; days[tk].extra=[];
  seedEx(days);
  // Kniestand (Testphase) außerplanmäßig in zwei vergangenen LWS-/Hüfte-Einheiten mit Folgetagswerten
  const e4r=[1,1];
  for(let i=2;i<=27&&e4r.length;i++){
    const day=days[iso(addD(today,-i))]; const nx=days[iso(addD(today,-i+1))];
    if(!day||!nx||!Object.keys(nx.sy||{}).length)continue;
    const a=day.done.find(x=>x.block==='b1'&&x.ex); if(!a)continue;
    a.ex.push({id:'e4',side:null,t:a.savedAt,extra:true,r:e4r.shift(),pain:false});
    a.extra=['Kniestand'];
    if(!day.abw.includes('+ Kniestand (Testphase)'))day.abw.push('+ Kniestand (Testphase)');
  }
  return days;
}
// Beispiel-Übungslisten in sechs vergangene Einheiten legen, damit „Letzte Einheiten“ sofort gefüllt ist
function seedEx(days){
  const RAT ={e1:[1,1,1,1,1,1], e2:[1,1,1,1,1,1], e5:[1,1,1,1,1,1], e6:[1,1,1,1,1,1]};
  const PAIN={e1:[false,false,false,false,true,false], e2:[false,true,false,false,false,false],
              e5:[false,false,true,false,false,false], e6:[true,false,false,false,true,false]};
  const NOTE={e1:['nur rechts gut',null,null,'Fuß wandert nach außen',null,null],
              e2:[null,'danach leicht verspannt',null,null,'Haltung gut gehalten',null],
              e5:[null,null,'16 kg zu schwer',null,null,'ruhig geatmet'],
              e6:['danach leicht verspannt',null,null,null,'rechts deutlich stärker',null]};
  const SKIP={e3:[1],e7:[1,3]}; // übersprungen in einzelnen Einheiten (Index je Block), damit der Kalender unvollständige Einheiten zeigt
  // Test-Retest beim Liegenden Läufer in zwei Einheiten (Index 0 = jüngste): älter +5 links, neuer +10 links
  const SLR='Gestrecktes Beinheben (SLR)';
  const RT={e1:{4:{test:SLR,vor:{l:60,r:70},nach:{l:65,r:70}},1:{test:SLR,vor:{l:60,r:70},nach:{l:70,r:70}}}};
  const cnt={b1:0,b3:0};
  for(let i=1;i<=27;i++){
    if(cnt.b1>=6&&cnt.b3>=6)break;
    const d=addD(today,-i); const day=days[iso(d)]; if(!day)continue;
    const ts=new Date(d); ts.setHours(18,0,0,0); const t=ts.getTime();
    day.done.forEach(a=>{
      if(cnt[a.block]==null||cnt[a.block]>=6)return;
      const bl=blockById(a.block); if(!bl)return;
      const n=cnt[a.block];
      a.ex=bl.items.map(([id,pr,sd])=>{
        const it={id,side:sd==='L'||sd==='R'?sd:null,t};
        if(SKIP[id]&&SKIP[id].includes(n)){it.skip=true;it.pain=false}
        else if(RAT[id]){it.r=RAT[id][n];it.pain=PAIN[id][n];if(NOTE[id][n])it.note=NOTE[id][n]}
        else {it.r=1;it.pain=false}
        if(a.block==='b1'&&RT[id]&&RT[id][n])it.rt=JSON.parse(JSON.stringify(RT[id][n]));
        return it;
      });
      a.skipped=a.ex.filter(i=>i.skip).length; a.open=false; a.segments=1; a.active=a.dur; a.savedAt=t;
      cnt[a.block]++;
    });
  }
}

function hydrate(obj){
  if(!obj||typeof obj!=='object'||Array.isArray(obj))throw new Error('keine Daten');
  S=obj; resetContent();
  // offenes Notizfeld nicht wiederherstellen (Text ist gespeichert, das Feld öffnet nur „+“ oder „!“)
  if(S.session&&Array.isArray(S.session.items))S.session.items.forEach(i=>{if(i)delete i.noteOpen});
  if(!S.days||typeof S.days!=='object')S.days={};
  if(!S.plan)initPlan();
  if(!Array.isArray(S.plan.ziele)){S.plan.ziele=ZIELE_SEED();S.plan.zseq=S.plan.ziele.length}
  if(!Array.isArray(S.plan.events))S.plan.events=[];
  if(!S.exStatus||typeof S.exStatus!=='object')S.exStatus={};
  if(!Array.isArray(S.inbox))S.inbox=[];
  if(!Array.isArray(S.rettung))S.rettung=RETT_SEED();
  if(!S.exTests||typeof S.exTests!=='object')S.exTests={};
  if(S.exGoal&&typeof S.exGoal==='object')Object.entries(S.exGoal).forEach(([k,id])=>{const z=S.plan.ziele.find(x=>x.id===id);if(z&&!(S.exTests[k]||[]).length)S.exTests[k]=[{test:z.test,side:z.side||''}]});delete S.exGoal;
  if(!S.exNotes||typeof S.exNotes!=='object')S.exNotes={};
  // leere Symptomliste ist erlaubt (alle gelöscht); nur ein fehlender Eintrag wird neu belegt
  if(!Array.isArray(S.symptoms))S.symptoms=SYM_SEED.map(s=>Object.assign({},s));
  Object.values(S.days).forEach(dd=>{if(!dd.sy||Array.isArray(dd.sy))dd.sy={};if(!dd.syA||Array.isArray(dd.syA))dd.syA={};if(!Array.isArray(dd.extra))dd.extra=[];['done','abw','notes','tests','chips','planned'].forEach(f=>{if(!Array.isArray(dd[f]))dd[f]=[]});dd.done.forEach(a=>(a.ex||[]).forEach(migR))});
  if(S.session&&Array.isArray(S.session.items))S.session.items.forEach(migR); if(S.session&&S.sessShow==null)S.sessShow=S.tab==='training';
  // gelöschte Beispielübungen (Testkanal), eigene Übungen, Bearbeitungen, Cues, Dosis, Prinzip-Cues
  const del=Array.isArray(S.exDeleted)?S.exDeleted:[]; for(let i=EX.length-1;i>=0;i--)if(del.includes(EX[i].id))EX.splice(i,1);
  (S.customEx||[]).forEach(c=>{if(!EX.some(e=>e.id===c.id)){EX.push(c)}});
  Object.entries(S.exEdit||{}).forEach(([id,f])=>{const e=EX.find(x=>x.id===id);if(e)Object.assign(e,f)});
  Object.entries(S.cues||{}).forEach(([id,arr])=>{const e=EX.find(x=>x.id===id);if(e)e.cues=arr});
  Object.entries(S.dose||{}).forEach(([id,d])=>{const e=EX.find(x=>x.id===id);if(e)e.d=d});
  EX.forEach(e=>{if(!Array.isArray(e.tags))e.tags=[];if(!Array.isArray(e.cues))e.cues=[];if(!e.d)e.d={sets:1,n:1,u:'Wdh'};fixVideo(e)});
  Object.entries(S.prinzip||{}).forEach(([k,arr])=>{if(Array.isArray(arr))PRINZIP[k]=arr});
  pzTags().forEach(t=>{if(!Array.isArray(PRINZIP[t]))PRINZIP[t]=[]});
  fixKalRows(); ensureDay(iso(today));
}

  main.innerHTML=`

// ---------- Einzelnen Tag planen (heute oder künftig) ----------
const PLAN_ACTS=['Tennis','Laufen'];
function planSheet(k,title){
  const dt=new Date(k+'T12:00:00'); const isT=k===iso(today);
  const cur=dayOf(dt).planned;
  const chip=(t,sw,l)=>`<button class="chip bch ${cur.includes(t)?'on':''}" data-t="${t}"><i class="sw ${sw}"></i>${esc(l)}</button>`;
  openSheet(`<h3>${title||'Planen · '+wd(dt)+', '+fmt(dt)}</h3><div class="hint">${isT?'Nur heute. Wird im Kalender als Abweichung markiert.':'Nur dieser Tag. Das Wochenraster bleibt, spätere Rasteränderungen lassen den Tag unverändert.'}</div>
    <div id="ct"><div class="chips">${P().blocks.map(b=>chip(b.id,b.type,b.name)).join('')||'<span class="hint">Noch kein Block angelegt.</span>'}</div>
    <div class="chips" style="margin-top:8px">${[...PLAN_ACTS,'Pause'].map(t=>chip(t,t,TYPES[t].l)).join('')}</div></div>
    <div class="hint">Mehrere gleichzeitig möglich. „Pause“ schließt alle anderen aus.</div><button class="btn primary wide" id="ctSave">Übernehmen</button>`);
  document.querySelectorAll('#ct .chip').forEach(c=>c.onclick=()=>{
    if(c.dataset.t==='Pause'){const on=c.classList.contains('on');document.querySelectorAll('#ct .chip').forEach(x=>x.classList.remove('on'));if(!on)c.classList.add('on')}
    else{c.classList.toggle('on');const pz=document.querySelector('#ct .chip[data-t="Pause"]');if(pz)pz.classList.remove('on')}});
  document.getElementById('ctSave').onclick=()=>{
    const before=cur.map(labelOf).join(' + ');
    const sel=[...document.querySelectorAll('#ct .chip.on')].map(c=>c.dataset.t);
    const dd=ensureDay(k);
    dd.planned=sel.includes('Pause')?['Pause']:sel;
    dd.plannedManual=true;
    if(isT)dd.abw=[...dd.abw.filter(a=>!a.startsWith('Plan geändert')),`Plan geändert: ${before||'–'} → ${dd.planned.map(labelOf).join(' + ')||'–'}`];
    closeSheet();render();toast(isT?'Heute geändert':wd(dt)+', '+fmt(dt)+' geplant')};
}

// ---------- Symptome ----------
function symAddSheet(){
  const d=D(); let side='', mode='aktiv', nm='';
  const draw=()=>{
    const ruh=symList().filter(s=>!s.active&&!(d.extra||[]).includes(s.id));
    openSheet(`<h3>Weiteres Symptom heute</h3>
    <div class="row" style="gap:8px"><span class="lbl">Ruhende Symptome</span>${qBtn('symruh')}</div>
    <div class="chips" id="ruh">${ruh.map(s=>`<button class="chip sm" data-symadd="${s.id}">${esc(symName(s))}</button>`).join('')||'<span class="hint">Keine ruhenden Symptome.</span>'}</div>
    ${qHint('symruh','Tipp blendet das Symptom nur für heute ein. Vergangene Tage bleiben unverändert.')}
    <div class="lbl" style="margin-top:4px">Neues Symptom anlegen</div>
    <input type="text" id="symn" placeholder="Name, z. B. Schulter vorne" value="${esc(nm)}">
    <div class="row between"><span class="lbl">Seite</span><div class="chips">${SIDES.map(([k,l])=>`<button class="chip sm ${side===k?'on':''}" data-symside="${k}">${l}</button>`).join('')}</div></div>
    <div class="row between"><span class="row" style="gap:8px"><span class="lbl">Aufnehmen als</span>${qBtn('symmode')}</span><div class="chips">${[['aktiv','aktiv'],['heute','nur heute']].map(([k,l])=>`<button class="chip sm ${mode===k?'on':''}" data-symmode="${k}">${l}</button>`).join('')}</div></div>
    ${qHint('symmode','„aktiv“ zeigt es ab jetzt jeden Tag. „nur heute“ legt es ruhend an und blendet es für heute ein.')}
    <button class="btn primary wide" id="symsave">Anlegen</button>
    <button class="tog" id="symtomanage" style="text-align:center">Symptome verwalten ›</button>`);
    const keep=()=>{const i=document.getElementById('symn');if(i)nm=i.value};
    document.querySelectorAll('[data-symadd]').forEach(b=>b.onclick=()=>{
      d.extra=d.extra||[];if(!d.extra.includes(b.dataset.symadd))d.extra.push(b.dataset.symadd);
      closeSheet();toast('Für heute eingeblendet');render()});
    document.querySelectorAll('[data-symside]').forEach(b=>b.onclick=()=>{keep();side=b.dataset.symside;draw()});
    document.querySelectorAll('[data-symmode]').forEach(b=>b.onclick=()=>{keep();mode=b.dataset.symmode;draw()});
    document.getElementById('symtomanage').onclick=()=>symManageSheet();
    document.getElementById('symsave').onclick=()=>{
      keep();const name=nm.trim();if(!name){toast('Name fehlt');return}
      const id=newSymId(); const s={id,name,side,active:mode==='aktiv'};
      S.symptoms.push(s);
      if(!s.active){d.extra=d.extra||[];d.extra.push(id)}
      addEvent('Symptom '+symName(s)+': neu angelegt'+(s.active?'':' (nur heute)'));
      closeSheet();toast('Symptom angelegt');render()};
  };
  draw();
}
function symManageSheet(){
  openSheet(`<div class="row between" style="flex-wrap:nowrap"><h3>Symptome verwalten</h3>${qBtn('symman')}</div>
  ${qHint('symman','Nur aktive Symptome stehen im täglichen Check-in. Ruhend stellen lässt vergangene Werte unverändert. Tipp auf den Namen öffnet Bearbeiten.')}
  <div class="list">${symList().map(s=>`<div class="item"><div class="t"><button class="nm" style="text-align:left;width:100%" data-symedit="${s.id}"><b>${esc(symName(s))}</b></button></div><button class="chip sm ${s.active?'on':''}" data-symtog="${s.id}">${s.active?'aktiv':'ruhend'}</button></div>`).join('')||'<div class="hint">Noch kein Symptom angelegt.</div>'}</div>
  <button class="btn ghost wide" id="symnew">+ Symptom</button>`);
  document.querySelectorAll('[data-symtog]').forEach(b=>b.onclick=()=>{
    const s=symById(b.dataset.symtog);if(!s)return;
    s.active=!s.active;
    if(s.active)Object.values(S.days).forEach(dd=>{if(dd.extra)dd.extra=dd.extra.filter(x=>x!==s.id)});
    addEvent('Symptom '+symName(s)+': '+(s.active?'aktiv':'ruhend'));
    toast(s.active?'Wieder aktiv':'Ruhend gestellt');render();symManageSheet()});
  document.querySelectorAll('[data-symedit]').forEach(b=>b.onclick=()=>symEditSheet(b.dataset.symedit));
  document.getElementById('symnew').onclick=()=>symEditSheet(null);
}
function symEditSheet(id){
  const s=id?symById(id):null; if(id&&!s)return;
  let side=s?s.side:'', nm=s?s.name:'';
  const draw=()=>{
    openSheet(`<h3>${s?'Symptom bearbeiten':'Neues Symptom'}</h3>
    <div class="lbl">Name</div><input type="text" id="symn" value="${esc(nm)}" placeholder="Name, z. B. Schulter vorne">
    <div class="row between"><span class="lbl">Seite</span><div class="chips">${SIDES.map(([k,l])=>`<button class="chip sm ${side===k?'on':''}" data-symside="${k}">${l}</button>`).join('')}</div></div>
    <button class="btn primary wide" id="symsave">Speichern</button>
    ${s?'<button class="btn danger wide" id="symdel">Symptom löschen</button><div class="hint">Löschen nimmt das Symptom aus allen Listen. Vergangene Werte bleiben in den Tagen gespeichert, werden aber nicht mehr angezeigt.</div>':''}
    <button class="tog" id="symback" style="text-align:center">‹ zurück zur Liste</button>`);
    const keep=()=>{const i=document.getElementById('symn');if(i)nm=i.value};
    document.querySelectorAll('[data-symside]').forEach(b=>b.onclick=()=>{keep();side=b.dataset.symside;draw()});
    document.getElementById('symback').onclick=()=>symManageSheet();
    document.getElementById('symsave').onclick=()=>{
      keep();const name=nm.trim();if(!name){toast('Name fehlt');return}
      if(s){const alt=symName(s);s.name=name;s.side=side;if(alt!==symName(s))addEvent('Symptom umbenannt: „'+alt+'“ → „'+symName(s)+'“');toast('Symptom gespeichert')}
      else{const ns={id:newSymId(),name,side,active:true};S.symptoms.push(ns);addEvent('Symptom '+symName(ns)+': neu angelegt');toast('Symptom angelegt')}

    const del=document.getElementById('symdel');

      addEvent('Symptom '+alt+': gelöscht');

  };
  draw();
}

// ---------- Training ----------

      const list=!open?'':items.map(({id,sd,it})=>{const e=exById(id);const sk=it&&it.skip;const mark=it&&it.r&&!sk?'<span style="color:var(--accent);font-weight:700">✓</span>':'';

      return `<div class="trrow" data-trrow="${esc(bid)}"><button class="trhead" data-trtog="${esc(bid)}" aria-expanded="${open}"><span class="act ${type}">${type}</span><span class="t"><b>${esc(labelOf(bid))}</b><span class="trst${ok?' ok':''}">${st}</span></span><span class="trarr" aria-hidden="true">${open?'▾':'▸'}</span></button>${open?`<div class="trbody"><div class="list">${list||'<div class="hint">Noch keine Übung.</div>'}</div><button class="btn ${cl} wide" data-go="${esc(bid)}">${btn}</button></div>`:''}</div>`};
    // Sportzeile (Tennis, Laufen): erfasste Einträge als Chips (Tipp → ändern/löschen), „Erfassen“ bleibt, mehrere Einträge erlaubt
    const sportRow=(t,planned)=>{const ents=d.done.map((a,i)=>({a,i})).filter(o=>o.a.type===t&&!o.a.block);
      return `<div class="trrow" data-sport="${t}"><div class="trsport"><span class="act ${t}">${t.slice(0,1)}</span><div class="t"><b>${TYPES[t].l}</b>${ents.length?`<div class="chips">${ents.map(({a,i})=>aktChip(a,i,'✓ '+(aktShort(a)||'erfasst'))).join('')}</div>`:planned?'<span class="trst">geplant</span>':''}</div><button class="btn ghost" data-akt="${t}" style="padding:7px 12px;font-size:13px">Erfassen</button></div></div>`};
    const todayRows=[...rowIds.map(id=>blockRow(id)),...PLAN_ACTS.filter(t=>d.planned.includes(t)).map(t=>sportRow(t,true))].join('');

    const runOther=s&&s.date!==tk?`<section class="card" id="trRun"><h2>Nachtrag <span class="badge">${dfmt(s.date)}</span></h2><div class="trlist"><div class="trrow"><div class="trsport"><div class="t"><b>${esc(s.label)}</b><span class="trst">${esc((a=>a?runState(a,s.date):'läuft')((S.days[s.date]||{done:[]}).done[findEntry(s.date,s.block)]))}</span></div><button class="btn primary" id="runGo" style="padding:7px 12px;font-size:13px">Weitermachen</button></div></div></div></section>`:'';

    <section class="card" id="trMore"><h2>Weitere</h2><div class="trlist">${rest.map(b=>blockRow(b.id,true)).join('')}${PLAN_ACTS.filter(t=>!d.planned.includes(t)).map(t=>sportRow(t,false)).join('')}${rowIds.includes('F')?'':`<div class="trrow" data-free="1"><div class="trsport"><div class="t"><b>Freies Training</b><span class="trst">ohne Block</span></div><button class="btn ghost" data-go="F" style="padding:7px 12px;font-size:13px">Leer starten</button></div></div>`}</div></section>

    const rg=document.getElementById('runGo'); if(rg)rg.onclick=()=>startSession(s.block,s.date);
    document.querySelectorAll('[data-akt]').forEach(b=>b.onclick=()=>aktSheet(tk,b.dataset.akt));
    document.querySelectorAll('[data-aedit]').forEach(b=>b.onclick=()=>aktEditSheet(tk,+b.dataset.aedit));
    return;
  }
  // Timer läuft nur, solange seine Übung offen ist: Haken, Zuklappen oder eine andere Übung öffnen beendet ihn wie ein Tipp aufs laufende Kästchen
  // (tatsächliche Zeit wird eingetragen); überspringen verwirft ihn (Wunsch 05.10.2026)
  if(TIMER&&!(TIMER.it.open&&s.items.includes(TIMER.it))){if(TIMER.it.skip||!s.items.includes(TIMER.it))stopTimer();else timerEarly(false)}
  const curEntry=(i=>i>=0?S.days[s.date].done[i]:null)(S.days[s.date]?findEntry(s.date,s.block):-1);
  // Notizen zur Übung unter den Cues (nur offene Übung, „+“ fügt hinzu): höchstens NOTE_MAX sichtbar, weitere im eigenen Scrollbereich (notesFit); Tipp ändert oder löscht
  // Notiz dieser Einheit: während das Feld offen ist, steht sie nur im Feld, danach oben in der Liste
  const trNotes=(e,it,idx)=>{const all=exNoteList(e.id,it.noteOpen?curEntry:null);
    return `<div class="trnotes"><div class="trn-h nhead"><span>Notizen${all.length>NOTE_MAX?` · ${all.length}`:''}</span>${it.noteOpen?'':notePlus('tr:'+idx)}</div>`
      +(it.noteOpen?noteInput('tr:'+idx,it.note,it.pain?'Was war? z. B. Ziehen rechts, Fuß gerutscht':'Notiz zur Übung, z. B. nur rechts super',`data-note="${idx}"`):'')
      +(all.length?noteListHtml(all,'tr:'+e.id):'')+`</div>`};
  // „✓“ oder Eingabetaste: Feld schließen; die Notiz (schon gespeichert) steht danach oben in der Liste
  const noteDoneTr=idx=>{const it=s.items[idx],i=document.querySelector(`#exlist [data-ninput="tr:${idx}"]`),v=(i?i.value:(it.note||'')).trim();
    if(v)it.note=v;else delete it.note;it.noteOpen=false;if(i)i.blur();render();if(v)toast('Notiz gespeichert')};
  // Satzleiste der offenen Übung: Kästchen je Satz (blass = offen, kräftig = gemacht), „+“ hängt einen Satz an, darunter bei Auswahl „− +“
  const setBox=(it,e,idx,o)=>{const d=planD(it,e),run=timerOn(it,o.i),sel=SETEDIT&&SETEDIT.it===it&&SETEDIT.si===o.i,x=o.s;
    const abw=x&&!o.extra&&(x.n!==d.n||(x.kg??null)!==(d.kg??null));
    const inner=run?`<span class="v">${fmtSec(timerLeft())}</span><span class="u">■ beenden</span>`
      :!x&&d.u==='s'?`<span class="v">▶ ${d.n}</span><span class="u">s</span>`
      :`<span class="v">${x?x.n:d.n}</span><span class="u">${esc(d.u)}${(x?x.kg:d.kg)!=null?' · '+kgStr(x?x.kg:d.kg)+' kg':''}</span>`+(abw?`<span class="pl">Plan ${d.n}${d.kg!=null&&x.kg!==d.kg?' · '+kgStr(d.kg)+' kg':''}</span>`:o.extra&&x?'<span class="pl">extra</span>':'');
    return `<button class="set${x?' done':''}${sel?' edit':''}${run?' run':''}" data-set="${idx}:${o.i}" aria-label="Satz ${o.i+1}, ${x?'gemacht '+x.n:'geplant '+d.n} ${esc(d.u)}">${inner}</button>`};
  const setStep=(it,e,idx)=>{if(!SETEDIT||SETEDIT.it!==it)return '';const d=planD(it,e),x=(it.sets||[])[SETEDIT.si];if(!x)return '';const st=d.u==='s'?5:1,ex=SETEDIT.si>=Math.max(1,d.sets||1);
    return `<div class="setstep"><span class="t">Satz ${SETEDIT.si+1}</span><div class="sp"><button data-setd="n:-${st}" aria-label="weniger">−</button><b>${x.n}</b><span>${esc(d.u)}</span><button data-setd="n:${st}" aria-label="mehr">+</button></div>`
      +(x.kg!=null?`<div class="sp"><button data-setd="kg:-1" aria-label="weniger Gewicht">−</button><b>${kgStr(x.kg)}</b><span>kg</span><button data-setd="kg:1" aria-label="mehr Gewicht">+</button></div>`:'')
      +`<button class="rm" data-setd="${ex?'del':'undo'}">${ex?'Satz entfernen':'nicht gemacht'}</button></div>`};
  const setsSec=(it,e,idx)=>{const sl=setSlots(it,e),n=sl.filter(o=>o.s).length;
    return `<div class="trn-h nhead sethd"><span>Sätze</span><span class="setcnt">${n} von ${sl.length}</span></div><div class="sets">${sl.map(o=>setBox(it,e,idx,o)).join('')}<button class="setplus" data-setplus="${idx}" aria-label="Satz anhängen">+</button></div>${setStep(it,e,idx)}`};
  const rows=s.items.map((it,idx)=>{const e=exById(it.id); if(!it.open){it.noteOpen=false;if(SETEDIT&&SETEDIT.it===it)SETEDIT=null}
    // Zugeklappt nur die Anzahl eigener Cues; aufgeklappt eigene und Prinzip-Cues vollständig im Kasten
    const nc=e.cues.length, cnt=it.open?'':`<span class="cuecnt"> · ${nc?nc+(nc===1?' Cue':' Cues'):'keine Cues'}</span>`;
    const ck='cue:tr:'+idx, cl=cueListe(e,ck);
    const box=!it.open?'':cueHead(ck,'trn-h cuehd','Cues')+`<div class="cuebox">${cl.length?cl.map(({c,ci})=>`<button class="cueline" data-ec="${idx}:${ci}">${esc(c)}</button>`).join(''):'<div class="cuenone">Noch keine eigenen Cues.</div>'}${e.tags.filter(t=>pzHas(t)&&(PRINZIP[t]||[]).length).map(t=>`<div class="cuetag">${esc(t)}</div>${(PRINZIP[t]||[]).map((c,ci)=>`<button class="cueline p" data-pc="${t}:${ci}">${esc(c)}</button>`).join('')}`).join('')}</div>`;
    return `<div class="ex ${it.r?'done':''} ${it.skip?'skipped':''} ${it.open?'open':''}" data-i="${idx}"><span class="swhint l">überspringen</span><span class="swhint r">doch machen</span>
      <div class="head"><div class="name"><button class="nm" data-tog="${idx}"><b>${esc(e.name)}${it.extra?' <span class="badge">außerplanmäßig</span>':''}${exStatus(e)==='testphase'?' <span class="badge test">Testphase</span>':''}</b></button><small><span class="dosetxt">${doseStr(planD(it,e))}</span>${e.side==='getrennt'?`<span class="sidet"> · ${it.side==='L'?'nur links':it.side==='R'?'nur rechts':'beide Seiten'}</span>`:''}${cnt}${!it.open&&setsDone(it).length?`<span class="setsum"> · ${setsDone(it).length} von ${setSlots(it,e).length} Sätzen</span>`:''}${!it.open&&it.rt&&it.rt.nach?'<span style="color:var(--ink2)"> · Retest</span>':''}${it.skip?' · übersprungen':''}</small></div>
        <div class="rate"><button data-r="1" class="${it.r?'on':''}" title="gemacht" aria-pressed="${!!it.r}">✓</button><button data-pain class="pain ${it.pain?'on':''}" title="Problem oder Schmerz" aria-pressed="${!!it.pain}">!</button></div></div>
      <div class="body">${it.open?videoBox(e,'tr'):''}${box}${it.open?setsSec(it,e,idx)+trNotes(e,it,idx):''}
        ${!it.rt?'':`<div class="rtline"><span>${esc(testShort(it.rt.test))} · ${rtText(it.rt)}</span>${it.rt.nach?`<button class="chip sm" data-rtdel="${idx}">ändern</button>`:`<button class="chip sm" data-rtnach="${idx}">danach messen</button>`}</div>`}
        <div class="exacts">${it.rt?'':`<button data-rt="${idx}">Test davor</button>`}</div>
      </div></div>`}).join('');
  const done=s.items.filter(i=>i.r).length, total=s.items.filter(i=>!i.skip).length, todo=s.items.filter(exTodo).length;
  main.innerHTML=`<section class="card" id="sesshead"><div class="row between" style="flex-wrap:nowrap"><div style="min-width:0"><b>${esc(s.label)}</b>${s.date!==iso(today)?` <span class="badge">Nachtrag ${dfmt(s.date)}</span>`:''}${s.snapshot!=null?' <span class="badge">fortgesetzt</span>':''}<div class="hint" style="display:flex;align-items:center;gap:8px">${done} von ${total} gemacht · ${durStr(sessMin(s))}${qBtn('haken')}</div></div><button class="btn ghost" id="addEx">+ Übung</button></div>${qHint('haken','Haken = gemacht. „!“ = Problem bei der Ausführung oder Schmerz, schreib kurz dazu, was war. Wirkung misst du mit „Test davor“, die Reaktion später am Tag und am Folgetag zeigt der Kalender.','margin-top:8px')}
    <div class="row" style="margin-top:4px;justify-content:flex-end"><button class="tog danger" id="abort">Verwerfen</button></div></section>

  <div id="sessbar"><button class="btn primary" id="fin">${todo?`Fertig · ${todo} offen`:'Fertig'}</button></div>`;
  const list=document.getElementById('exlist');
  // Wischen: links = überspringen, rechts = doch machen
  let sw=null;
  list.addEventListener('pointerdown',ev=>{const row=ev.target.closest('.ex');if(!row||ev.target.closest('input,textarea'))return;sw={row,x0:ev.clientX,y0:ev.clientY,dx:0,id:ev.pointerId};});
  list.addEventListener('pointermove',ev=>{if(!sw||ev.pointerId!==sw.id)return;const dx=ev.clientX-sw.x0,dy=ev.clientY-sw.y0;if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dx)<10)return;sw.dx=dx;sw.row.classList.add('drag');sw.row.style.transform=`translateX(${Math.max(-110,Math.min(110,dx))}px)`;sw.row.classList.toggle('showl',dx<-40);sw.row.classList.toggle('showr',dx>40);});
  const endSw=ev=>{if(!sw)return;const {row,dx}=sw;const it=s.items[+row.dataset.i];row.classList.remove('drag','showl','showr');row.style.transform='';sw=null;
    if(dx<-70){if(!it.skip){it.skip=true;it.r=null;it.t=Date.now();if(it.open)openNext(s.items,+row.dataset.i);list._sup=Date.now();render();toast('Übersprungen')}}
    else if(dx>70){if(it.skip){it.skip=false;it.t=null;list._sup=Date.now();render();toast('Doch machen')}}};
  list.addEventListener('pointerup',endSw);list.addEventListener('pointercancel',endSw);
  list.addEventListener('click',ev=>{
    if(list._sup&&Date.now()-list._sup<400)return;
    const b=ev.target.closest('button'); const row=ev.target.closest('.ex'); if(!row) return; const idx=+row.dataset.i; const it=s.items[idx];

      const [k,dv]=v.split(':');if(k==='n')x.n=Math.max(1,x.n+ +dv);else x.kg=Math.max(0,Math.round((x.kg+ +dv)*10)/10);render();return}

  });
  // Notiz zur Übung: bei jeder Eingabe mitspeichern, ohne neu zu zeichnen (Fokus bleibt)
  list.querySelectorAll('[data-note]').forEach(i=>{i.oninput=e=>{s.items[+i.dataset.note].note=e.target.value;syncSession();save()};

const DRAGH='<button class="dragh" aria-label="Ziehen zum Verschieben" type="button"><svg viewBox="0 0 10 16" aria-hidden="true"><circle cx="2.5" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="2.5" cy="8" r="1.4"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="2.5" cy="13" r="1.4"/><circle cx="7.5" cy="13" r="1.4"/></svg></button>';
const moveItem=(arr,from,to)=>{const a=[...arr];const [x]=a.splice(from,1);a.splice(to,0,x);return a};
// onMove(from,to) nur, wenn sich die Position geändert hat
function sortable(list,onMove){
  list.addEventListener('pointerdown',ev=>{
    const h=ev.target.closest('.dragh'); if(!h||!list.contains(h)||ev.button>0)return;
    const rows=[...list.children].filter(r=>r.classList.contains('sortrow')); const row=h.closest('.sortrow'); const from=rows.indexOf(row); if(from<0||rows.length<2)return;
    ev.preventDefault(); ev.stopPropagation();
    try{h.setPointerCapture(ev.pointerId)}catch(e){}
    const inSheet=list.closest('.sheet'), sc=inSheet||document.scrollingElement, st0=sc.scrollTop;
    const rects=rows.map(r=>r.getBoundingClientRect()); const gap=rects.length>1?Math.max(0,rects[1].top-rects[0].bottom):0;
    const step=rects[from].height+gap, mid0=rects[from].top+rects[from].height/2, y0=ev.clientY; let to=from;
    row.classList.add('dragging');
    const move=e=>{
      const dy=e.clientY-y0+(sc.scrollTop-st0);
      row.style.transform='translateY('+dy+'px)';
      const mid=mid0+dy; to=0; rows.forEach((r,i)=>{if(i!==from&&rects[i].top+rects[i].height/2<mid)to++});
      rows.forEach((r,i)=>{if(i===from)return;const s=from<to&&i>from&&i<=to?-step:to<from&&i>=to&&i<from?step:0;r.style.transform=s?'translateY('+s+'px)':''});
      // am Rand mitscrollen
      const top=inSheet?inSheet.getBoundingClientRect().top:0, bot=inSheet?inSheet.getBoundingClientRect().bottom:innerHeight;
      if(e.clientY>bot-40)sc.scrollTop+=10; else if(e.clientY<top+40)sc.scrollTop-=10;
    };
    const end=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',end);h.removeEventListener('pointercancel',end);
      rows.forEach(r=>{r.style.transform='';r.classList.remove('dragging')});
      if(to!==from)onMove(from,to)};
    h.addEventListener('pointermove',move);h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  });
}

function addToPlan(id,blockId,after){
  const e=exById(id); const bl=blockById(blockId); if(!bl)return;
  const fin=side=>{bl.items.push([id,3,side]);newVersion('+ '+e.name+(side&&side!=='beide'?' ('+(side==='L'?'links':'rechts')+')':'')+' ('+bl.name+')');toast('Im Plan, neue Version v'+P().versions[P().versions.length-1].v);if(after)after()};

  else fin(null);

function newBlockSheet(after){
  let ty='K',nm='';

  const draw=()=>{openSheet(`<h3>Neuer Block</h3><input type="text" id="bn" placeholder="Name, z. B. Schulter / Nacken" value="${esc(nm)}">
    <div class="lbl">Typ</div><div class="chips">${[['K','Korrektiv'],['I','Intensiv']].map(([k,l])=>`<button class="chip sm ${ty===k?'on':''}" data-bty="${k}">${l}</button>`).join('')}</div>

      newVersion('Block „'+n+'“ angelegt');

function blockSheet(id,after){
  const p=P(); const b=blockById(id); if(!b)return;
  let ty=b.type,nm=b.name;
  const keep=()=>{const i=document.getElementById('bn');if(i)nm=i.value};
  const draw=()=>{const i=p.blocks.indexOf(b);
    openSheet(`<h3>Block bearbeiten</h3><div class="lbl">Name</div><input type="text" id="bn" value="${esc(nm)}">
    <div class="lbl">Typ</div><div class="chips">${[['K','Korrektiv'],['I','Intensiv']].map(([k,l])=>`<button class="chip sm ${ty===k?'on':''}" data-bty="${k}">${l}</button>`).join('')}</div>
    <div class="lbl">Reihenfolge</div><div class="row"><button class="btn ghost" id="bup"${i===0?' disabled':''}>↑ nach oben</button><button class="btn ghost" id="bdn"${i===p.blocks.length-1?' disabled':''}>↓ nach unten</button></div>
    <button class="btn primary wide" id="bsave">Speichern</button>
    <button class="btn ghost wide danger" id="bdel">Block löschen</button>
    <div class="hint">Name, Typ und Reihenfolge ändern den Plan nicht, sie erscheinen nur im Verlauf. Löschen erzeugt eine neue Version.</div>`);
    document.querySelectorAll('[data-bty]').forEach(x=>x.onclick=()=>{keep();ty=x.dataset.bty;draw()});
    const mv=n=>{keep();const j=p.blocks.indexOf(b);const t=p.blocks[j+n];if(!t)return;p.blocks[j+n]=b;p.blocks[j]=t;addEvent('Block „'+b.name+'“ verschoben');if(after)after();draw()};
    document.getElementById('bup').onclick=()=>mv(-1);
    document.getElementById('bdn').onclick=()=>mv(1);
    document.getElementById('bsave').onclick=()=>{const n=document.getElementById('bn').value.trim();if(!n){toast('Name fehlt');return}
      const alt=b.name; if(n!==alt){b.name=n;addEvent('Block umbenannt: „'+alt+'“ → „'+n+'“')}
      if(ty!==b.type){b.type=ty;addEvent('Block „'+b.name+'“: Typ '+TYPES[ty].l)}
      closeSheet();toast('Block gespeichert');if(after)after()};
    document.getElementById('bdel').onclick=()=>{
      // betroffene Wochentage im Raster und einzeln geplante Tage ab heute nennen
      const WK=['Mo','Di','Mi','Do','Fr','Sa','So'];
      const wds=WK.filter(w=>(p.raster[w]||[]).includes(id));
      const leer=wds.filter(w=>p.raster[w].every(x=>x===id));
      const einzeln=Object.keys(S.days).filter(k=>k>=iso(today)&&S.days[k].plannedManual&&S.days[k].planned.includes(id)).length;
      const body=wds.length||einzeln?`<div class="warn">${wds.length?`Steht im Raster an: ${wds.join(', ')}. ${leer.length===wds.length?'Diese Tage werden leer.':leer.length?leer.join(', ')+' wird leer, an den übrigen Tagen fällt nur dieser Block weg.':'Dort fällt nur dieser Block weg, die übrigen Einträge bleiben.'}`:''}${einzeln?`${wds.length?' ':''}Außerdem an ${einzeln} einzeln geplant${einzeln>1?'en Tagen':'em Tag'}.`:''}</div>`:'<div class="hint">Steht an keinem Tag im Raster.</div>';
      confirmSheet('Block „'+esc(b.name)+'“ löschen? Die Übungen bleiben in der Bibliothek.',()=>{
      p.blocks=p.blocks.filter(x=>x!==b);
      Object.keys(p.raster).forEach(w=>p.raster[w]=p.raster[w].filter(x=>x!==id));
      // aus dem Plan von heute und allen künftigen Tagen entfernen, vergangene Tage bleiben Verlauf
      Object.keys(S.days).forEach(k=>{if(k>=iso(today))S.days[k].planned=S.days[k].planned.filter(x=>x!==id)});
      if(S.todayOpen===id)S.todayOpen=null;
      newVersion('Block „'+b.name+'“ gelöscht');
      toast('Block gelöscht, neue Version v'+p.versions[p.versions.length-1].v);if(after)after()},'Löschen',body)};
  }; draw();
}
const sideLbl=sd=>sd==='L'?' · nur links':sd==='R'?' · nur rechts':sd==='beide'?' · L/R':'';
const dfmt=k=>fmt(new Date(k+'T12:00:00'));
// Notizen zur Übung, eine Art (Entscheidung 02.10.2026): auf der Karte geschrieben (S.exNotes, i = Index) oder im Training
// (Notiz in der Einheit, S.days[k].done[ai].ex[ii].note); gemeinsam neueste oben. ref verweist auf die Stelle (noteRef).
// skip: Eintrag der laufenden Einheit, deren Notiz im Training schon im Eingabefeld steht
const exNoteList=(id,skip)=>{const ns=(S.exNotes||{})[id]||[];
  const un=[];Object.keys(S.days).forEach(k=>(S.days[k].done||[]).forEach((a,ai)=>{if(a===skip)return;(a.ex||[]).forEach((i,ii)=>{if(i.id===id&&i.note)un.push({d:k,t:i.note,ref:`d:${k}:${ai}:${ii}`})})}));
  return [...ns.map((n,i)=>({d:n.d,t:n.t,i,ref:`n:${id}:${i}`})),...un].sort((a,b)=>b.d.localeCompare(a.d)||(a.i==null)-(b.i==null)||(b.i??0)-(a.i??0))};
// Notizliste (Karte und Training): Datum und Text, Tipp öffnet Ändern/Löschen; ab NOTE_MAX Notizen eigener Scrollbereich (notesFit)
const NOTE_MAX=6;
const noteListHtml=(all,key)=>`<div class="nlist" data-nlist="${key}">${all.map(o=>`<button class="nl" data-nedit="${o.ref}"><span class="nd">${dfmt(o.d)}</span> ${esc(o.t)}</button>`).join('')}</div>`;
// Verweis auflösen; eine Notiz der laufenden Einheit wird auch in S.session geändert, sonst schriebe syncSession den alten Stand zurück
function noteRef(ref){const p=String(ref).split(':');
  if(p[0]==='n'){const ns=(S.exNotes||{})[p[1]],n=ns&&ns[+p[2]];
    return n?{id:p[1],d:n.d,t:n.t,set:v=>{n.t=v},del:()=>{ns.splice(+p[2],1);if(!ns.length)delete S.exNotes[p[1]]}}:null}
  const k=p[1],ai=+p[2],ii=+p[3],a=S.days[k]&&S.days[k].done[ai],it=a&&a.ex&&a.ex[ii]; if(!it||!it.note)return null;
  const s=S.session,live=s&&s.date===k&&findEntry(k,s.block)===ai&&s.items[ii]&&s.items[ii].id===it.id?s.items[ii]:null;
  return {id:it.id,d:k,t:it.note,set:v=>{it.note=v;if(live)live.note=v},del:()=>{delete it.note;if(live){delete live.note;live.noteOpen=false}}};
}
function noteEditSheet(ref){const r=noteRef(ref); if(!r)return; const e=exById(r.id);
  openSheet(`<h3>Notiz vom ${dfmt(r.d)}</h3><div class="hint">Bezug: ${esc(e?e.name:'')}</div><textarea id="exnt">${esc(r.t)}</textarea><div class="row"><button class="btn primary" id="exns">Speichern</button><button class="btn danger" id="exnd">Löschen</button></div>`);
  document.getElementById('exns').onclick=()=>{const v=document.getElementById('exnt').value.trim();if(v&&v!==r.t){r.set(v);toast('Notiz gespeichert')}closeSheet();render()};
  document.getElementById('exnd').onclick=()=>{r.del();closeSheet();toast('Notiz gelöscht');render()};
}
// Notiz hinzufügen, auf der Karte und im Training gleich: „+“ im Kopf „Notizen“ öffnet direkt darunter ein Feld mit „✓“ (das „+“ ist dann weg).
// Gespeichert wird bei jeder Eingabe; „✓“ oder die Eingabetaste schließt das Feld (Toast), die Notiz steht dann oben in der Liste.
const notePlus=(key,lbl)=>`<button class="nplus" data-nadd="${key}" aria-label="${lbl||'Notiz hinzufügen'}">+</button>`;
const noteInput=(key,val,ph,attr)=>`<div class="nadd"><input type="text" data-ninput="${key}" ${attr||''} enterkeyhint="done" autocomplete="off" placeholder="${ph}" value="${esc(val||'')}"><button class="nok" data-nok="${key}" aria-label="Notiz fertig">✓</button></div>`;
function noteFocus(key){const i=document.querySelector(`[data-ninput="${key}"]`);if(!i)return;try{i.focus()}catch(e){}const n=i.value.length;try{i.setSelectionRange(n,n)}catch(e){}}
// Karte: offenes Feld je Übung; n ist die beim Schreiben angelegte Notiz in S.exNotes (steht bis „✓“ nur im Feld, nicht in der Liste)
let BIB_NOTE=null;
// Cue hinzufügen, im Training und auf der Karte gleich (Wunsch 02.10.2026, wie bei den Notizen): „+“ im Kopf „Cues“ öffnet darunter ein Feld mit „✓“.
// Der Cue entsteht beim ersten Buchstaben (setCues); „✓“ oder Eingabetaste schließt (Toast, Eintrag im Journal). CUE_NEW = {key, id, i}
let CUE_NEW=null;
function cueAddOpen(key,id){if(!(CUE_NEW&&CUE_NEW.key===key))CUE_NEW={key,id,i:null};render();noteFocus(key)}
function cueAddDone(){const C=CUE_NEW;CUE_NEW=null;let t=null;
  if(C&&C.i!=null){const e=exById(C.id);if(e&&e.cues[C.i]!=null){const arr=[...e.cues];t=arr[C.i]=arr[C.i].trim();setCues(e,arr);
    ensureDay(C.key.startsWith('cue:tr:')&&S.session?S.session.date:iso(today)).notes.push({k:'Cue',t,b:e.name});save()}}
  const a=document.activeElement;if(a&&a.blur)a.blur();render();if(t)toast('Cue gespeichert')}
function cueInputBind(){const C=CUE_NEW;if(!C)return;const inp=document.querySelector(`[data-ninput="${C.key}"]`);if(!inp)return;const e=exById(C.id);
  inp.oninput=()=>{const v=inp.value,arr=[...e.cues];
    if(v.trim()){if(C.i==null){arr.push(v);C.i=arr.length-1}else arr[C.i]=v}else if(C.i!=null){arr.splice(C.i,1);C.i=null}
    setCues(e,arr)};
  inp.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();cueAddDone()}};
  const ok=inp.parentElement.querySelector('.nok');if(ok){ok.onmousedown=ev=>ev.preventDefault();ok.onclick=ev=>{ev.stopPropagation();cueAddDone()}}}
const cueHead=(key,cls,lbl)=>`<div class="${cls} nhead"><span${cls==='exsec-h'?' class="ftl"':''}>${lbl}</span>${CUE_NEW&&CUE_NEW.key===key?'':notePlus(key,'Cue hinzufügen')}</div>`
  +(CUE_NEW&&CUE_NEW.key===key?noteInput(key,CUE_NEW.i!=null?(exById(CUE_NEW.id)||{cues:[]}).cues[CUE_NEW.i]||'':'','Neuer Cue, z. B. Fuß bleibt stabil'):'');
// eigene Cues ohne den gerade im Feld entstehenden
const cueListe=(e,key)=>e.cues.map((c,ci)=>({c,ci})).filter(o=>!(CUE_NEW&&CUE_NEW.key===key&&CUE_NEW.i===o.ci));
function bibNoteDone(){const B=BIB_NOTE;BIB_NOTE=null;if(B&&B.n){B.n.t=B.n.t.trim();save()}const a=document.activeElement;if(a&&a.blur)a.blur();render();if(B&&B.n)toast('Notiz gespeichert')}
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);

// ---------- Bibliothek ----------
// Scrollposition je Bibliotheks-Sheet, beim Tippen im Sheet gemerkt (vor dem Handler)
const BIBY={};
sheet.addEventListener('click',()=>{const k=sheet.dataset.bibk;if(k)BIBY[k]=sheet.scrollTop},true);
function lastAssess(){
  const ks=Object.keys(S.days).filter(k=>k<=iso(today)&&(S.days[k].tests||[]).length).sort();
  if(ks.length)return dfmt(ks[ks.length-1]);
  let best=null;Object.values(TESTVALS).forEach(v=>v.forEach(x=>{const key=x[0].split('.').reverse().join('');if(!best||key>best.key)best={key,d:x[0]}}));
  return best?best.d:null;
}
